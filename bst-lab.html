<!doctype html>
<!--
  Dev tool (beasts): tight contact sheet — for each type one row of walk 0-3,
  fight 0-1, revived, cells sized to that type alone — saved to
  .shots/bstlab_<tag>.png.   /bst-lab.html?types=wolf,bat&tag=v1&scale=4
-->
<html>
  <head><meta charset="utf-8" /><title>beast lab</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; }</style></head>
  <body>
    <script type="module">
      import { rigFrame } from "/src/render/rigs.js";
      const q = new URLSearchParams(location.search);
      const types = (q.get("types") || "wolf").split(",");
      const TAG = q.get("tag") || "x", SC = Number(q.get("scale")) || 4;
      const cells = (q.get("cells") || "w0,w1,w2,w3,f0,f1,r0").split(",").map((s) => [s[0] === "f" ? "fight" : "walk", Number(s[1]), s[0] === "r" ? "revived" : ""]);
      const rows = types.map((t) => { const f = rigFrame(t, "walk", 0); return { t, w: f.cv.width + 4, h: f.cv.height + 4 }; });
      const W = Math.max(...rows.map((r) => r.w * cells.length)), H = rows.reduce((a, r) => a + r.h, 0);
      const cv = document.createElement("canvas"); cv.width = W * SC; cv.height = H * SC;
      const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
      let y = 0;
      for (const r of rows) {
        cells.forEach(([sheet, fr, v], i) => {
          ctx.fillStyle = i % 2 ? "#86b35a" : "#7eab54"; ctx.fillRect(i * r.w * SC, y * SC, r.w * SC, r.h * SC);
          const sp = rigFrame(r.t, sheet, fr, v);
          ctx.drawImage(sp.cv, (i * r.w + 2) * SC, (y + 2) * SC, sp.cv.width * SC, sp.cv.height * SC);
          // the anchor line
          ctx.fillStyle = "rgba(255,0,0,0.35)"; ctx.fillRect(i * r.w * SC, (y + 2 + sp.ay * 2) * SC, r.w * SC, 1);
        });
        y += r.h;
      }
      fetch("/__shot?name=bstlab_" + TAG, { method: "POST", body: cv.toDataURL("image/png").slice(22) }).then(() => { document.title = "DONE"; });
      document.body.appendChild(cv);
    </script>
  </body>
</html>
