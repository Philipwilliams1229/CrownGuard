<!doctype html>
<!--
  Dev tool: the wizard's and catapult's blast pictures against the area they
  really hit. Each row is one step of the hall (its `splash` from towers.js);
  each column a frame of the blast (8 frames, 320-380 ms). The dashed red
  ring is the true damage circle (update.js: a round circle of radius
  `splash`, full damage at the centre falling to 45% at the rim). The table
  measures how far the painted pixels reach, as a share of that radius.
  /aoe-lab.html   (?s=4 sets the zoom)
-->
<html><head><meta charset="utf-8" /><title>AOE lab</title>
<style>
body{background:#14171d;color:#e8e0c8;font:13px monospace;padding:16px}
h2{font-size:15px;margin:18px 0 6px} td,th{padding:2px 8px;text-align:right} th{color:#c9b98a}
.k{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 12px}
</style></head>
<body>
<div>Dashed red = the real damage circle. Yellow = what the animation covers at its widest frame. Grey tick marks every 10 board px. The goblin dot is a goblin's body width.</div>
<div id="out"></div>
<script type="module">
import { TOWERS } from "/src/data/towers.js";
import { ENEMIES } from "/src/data/enemies.js";
import { drawBlast, drawScorch } from "/src/render/fx.js";

const S = +(new URLSearchParams(location.search).get("s") || 3);
const NF = 8;
const W = TOWERS.wizard, C = TOWERS.catapult;
const rows = [
  ["Wizard L1", "arcane", W.levels[0].splash, 320],
  ["Wizard L3 High Sorcery", "arcane", W.levels[2].splash, 320],
  ["Pyromancer", "boom", W.branches.a.stats.splash, 320],
  ["Inferno Throne", "boom", W.branches.a.rank4.a.stats.splash, 320],
  ["Catapult L1", "dust", C.levels[0].splash, 380],
  ["Catapult L3 Master Eng.", "dust", C.levels[2].splash, 380],
  ["Trebuchet", "dust", C.branches.a.stats.splash, 380],
  ["Earthshaker", "dust", C.branches.a.rank4.a.stats.splash, 380],
  ["Comet Sling", "dust", C.branches.a.rank4.b.stats.splash, 380],
];
const gob = ENEMIES.goblin.size || 10;

// measure the painted reach of one frame: draw it alone, find its alpha box
const reach = (type, r, life, f) => {
  const pad = r * 4, cv = document.createElement("canvas");
  cv.width = cv.height = Math.ceil(pad * 2 * 2);
  const ctx = cv.getContext("2d"); ctx.scale(2, 2);
  const fx = { type, x: pad, y: pad, r, life, ttl: life * (1 - (f + 0.5) / NF) };
  drawBlast(ctx, fx, "g"); drawBlast(ctx, fx, "a");
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let L = 1e9, R = -1, T = 1e9, B = -1;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) if (d[(y * cv.width + x) * 4 + 3] > 24) {
    if (x < L) L = x; if (x > R) R = x; if (y < T) T = y; if (y > B) B = y;
  }
  if (R < 0) return null;
  const c = pad * 2;
  return { w: Math.max(c - L, R - c) / 2, up: (c - T) / 2, dn: (B - c) / 2 };
};

const out = document.getElementById("out");
const table = ["<h2>How far the animation reaches (board px, widest frame)</h2><table><tr><th style='text-align:left'>step</th><th>type</th><th>damage radius</th><th>anim sideways</th><th>x radius</th><th>anim up</th><th>anim down</th><th>down x radius</th></tr>"];
const sheets = [];

for (const [name, type, r, life] of rows) {
  let best = { w: 0, up: 0, dn: 0 };
  const per = [];
  for (let f = 0; f < NF; f++) { const m = reach(type, r, life, f); per.push(m); if (m) { best.w = Math.max(best.w, m.w); best.up = Math.max(best.up, m.up); best.dn = Math.max(best.dn, m.dn); } }
  table.push(`<tr><td style='text-align:left'>${name}</td><td>${type}</td><td>${r}</td><td>${best.w.toFixed(0)}</td><td><b>${(best.w / r).toFixed(2)}x</b></td><td>${best.up.toFixed(0)}</td><td>${best.dn.toFixed(0)}</td><td>${(best.dn / r).toFixed(2)}x</td></tr>`);

  // the sheet: frames 1,3,5,7 + the scorch, each in a cell 2.6 r across
  const cell = Math.ceil(r * 2.7), frames = [0, 2, 4, 6];
  const cv = document.createElement("canvas");
  cv.width = (cell * (frames.length + 1)) * S; cv.height = cell * S;
  cv.style.display = "block";
  const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false; ctx.scale(S, S);
  ctx.fillStyle = "#4f6a37"; ctx.fillRect(0, 0, cell * 5, cell);
  [...frames, "scorch"].forEach((f, i) => {
    const x = cell * i + cell / 2, y = cell * 0.55;
    ctx.strokeStyle = "#0004"; ctx.lineWidth = 1 / S; ctx.strokeRect(cell * i, 0, cell, cell);
    if (f === "scorch") drawScorch(ctx, { type: "scorch", x, y, r: Math.max(12, r * 0.62), ttl: 2000, life: 2600, seed: 1 });
    else { const fx = { type, x, y, r, life, ttl: life * (1 - (f + 0.5) / NF) }; drawBlast(ctx, fx, "g"); drawBlast(ctx, fx, "a"); }
    // the real damage circle
    ctx.save(); ctx.setLineDash([3 / S * 2, 3 / S * 2]); ctx.strokeStyle = "#ff4040"; ctx.lineWidth = 1.5 / S;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    // the widest reach of the animation (an ellipse up/down/sideways)
    if (f !== "scorch") { ctx.strokeStyle = "#ffd84088"; ctx.lineWidth = 1 / S; ctx.beginPath(); ctx.ellipse(x, y, best.w, best.dn, 0, 0, Math.PI); ctx.ellipse(x, y, best.w, best.up, 0, Math.PI, Math.PI * 2); ctx.stroke(); }
    // goblin for scale
    ctx.fillStyle = "#c8e070"; ctx.beginPath(); ctx.arc(x, y, gob / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `${10 / S * 1.4}px monospace`; ctx.fillText(f === "scorch" ? "scorch (2.6 s)" : `frame ${f + 1}/8`, cell * i + 2, 8);
  });
  sheets.push(`<h2>${name}: ${type}, damage radius ${r}</h2>`, cv);
}
table.push("</table>");
out.innerHTML = table.join("");
for (const s of sheets) typeof s === "string" ? out.insertAdjacentHTML("beforeend", s) : out.appendChild(s);
document.title = "AOE lab DONE";
</script>
</body></html>
