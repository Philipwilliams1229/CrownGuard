<!doctype html>
<!--
  Every hall form at NIGHT under the full blood moon (render/bloodmoon.js + nightlight.js): the real
  ground pass (shade, long shadows, the lamps' pools) and top pass (actor shade, red rake, the lamps'
  bloom). One row per kind, its nine forms; rows stacked. Saved to .shots/nighthall_<tag>.png.
    /night-halls.html?kinds=archer,knight&tag=x&k=1
-->
<html>
  <head><meta charset="utf-8" /><title>night halls</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; }</style></head>
  <body>
    <div id="status">painting…</div>
    <script type="module">
      import { W, H } from "/src/data/constants.js";
      import { selectRealm } from "/src/data/maps.js";
      import * as T from "/src/render/towers.js";
      import { groundLayer } from "/src/render/world.js";
      import { bloodmoonGround, bloodmoonPaint } from "/src/render/bloodmoon.js";
      const q = new URLSearchParams(location.search);
      const TAG = q.get("tag") || "x", K = Number(q.get("k") ?? 1);
      selectRealm(q.get("realm") || "bellmarsh");
      const P = {
        archer: T.drawArcherTower, knight: T.drawGarrison, wizard: T.drawWizardSpire, support: T.drawSupportTower,
        catapult: T.drawCatapult, spiker: T.drawBladewheel, goldworks: T.drawGoldworks, trapsmith: T.drawTrapsmith,
        falconry: T.drawFalconry, gunpowder: T.drawGunpowder, riverwatch: T.drawRiverwatchHall, assassin: T.drawAssassin, sunforge: T.drawSunforge, band: T.drawBandTower,
      };
      const KINDS = (q.get("kinds") || Object.keys(P).join(",")).split(",");
      const forms = [
        { level: 1 }, { level: 2 }, { level: 3 },
        { level: 3, branch: "a" }, { level: 3, branch: "a", rank4: "a" }, { level: 3, branch: "a", rank4: "b" },
        { level: 3, branch: "b" }, { level: 3, branch: "b", rank4: "a" }, { level: 3, branch: "b", rank4: "b" },
      ];
      const CW = 110, CH = 120, R = 2, HX = 420, HY = 290;
      const cv = document.createElement("canvas"); cv.width = CW * R * forms.length; cv.height = CH * R * KINDS.length;
      const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
      const sc = document.createElement("canvas"); sc.width = W * R; sc.height = H * R;
      const sctx = sc.getContext("2d");
      const ground = groundLayer();
      const w = { k: K, phase: "squall", paint: "bloodmoon", kind: "bloodmoon" };
      KINDS.forEach((kind, row) => forms.forEach((f, i) => {
        const time = 10 + row * 1.3 + i * 0.37;
        const t = { id: i + 3, kind, x: HX, y: HY, level: f.level, branch: f.branch || null, rank4: f.rank4 || null,
          cd: 0, aim: "first", lastAim: Math.PI, anim: 0, shotIdx: 0, critIdx: 0, invested: 0, units: [], rally: null,
          kills: 0, dmgOut: 0, liveTime: 1, _idle: true, charges: 3, ramp: 2, mAnim: 0, eagle: null };
        const g = { time, towers: [t], bands: [], enemies: [], weather: w };
        try {
          // a frame on a scratch canvas: the hall notes its lamps and itself
          sctx.setTransform(R, 0, 0, R, 0, 0);
          bloodmoonGround(sctx, g, w); P[kind](sctx, t, time); bloodmoonPaint(sctx, g, w);
          // the frame we keep
          ctx.save();
          ctx.beginPath(); ctx.rect(i * CW * R, row * CH * R, CW * R, CH * R); ctx.clip();
          ctx.setTransform(R, 0, 0, R, i * CW * R - (HX - 40) * R, row * CH * R - (HY - 90) * R);
          ctx.drawImage(ground, 0, 0, W, H);
          bloodmoonGround(ctx, g, w); P[kind](ctx, t, time); bloodmoonPaint(ctx, g, w);
          ctx.restore();
          ctx.fillStyle = "#fff"; ctx.font = "10px monospace";
          ctx.fillText(`${kind} ${f.level}${f.branch || ""}${f.rank4 || ""}`, i * CW * R + 4, row * CH * R + 12);
        } catch (e) { console.error(kind, e); }
      }));
      fetch("/__shot?name=nighthall_" + TAG, { method: "POST", body: cv.toDataURL("image/png").slice(22) }).then(() => { window.__done = true; });
    </script>
  </body>
</html>
