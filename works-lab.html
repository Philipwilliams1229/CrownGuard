<!doctype html>
<!--
  The castle works on the real engine: the castle with the works you name, foes
  spawned up the road from the gate, the game stepped at 60 fps and every
  `every`-th frame snapped through the real draw(), cropped round the gate.

    /works-lab.html?works=wizards:3,guards:3,archers:2&foes=levy,levy,orc&frames=12&every=6&tag=x
    &realm=thornbrook &faction=iron  &back=140 (how far from the gate the first foe starts)
    &warm=1  &crop=230,220  &scale=3   &set=hp:9999 (fields laid on every foe)

  Saved to .shots/workslab_<tag>.png, four frames to a row, each stamped with its game time.
-->
<html>
  <head><meta charset="utf-8" /><title>works lab</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; }</style></head>
  <body>
    <div id="status">running…</div>
    <script type="module">
      import { W, H, CASTLE_HP } from "/src/data/constants.js";
      import { selectRealm } from "/src/data/maps.js";
      import { selectFaction } from "/src/data/factions.js";
      import { TOTAL_LEN, PTS } from "/src/engine/path.js";
      import { updateGame, spawnAt } from "/src/engine/update.js";
      import { emptyWorks } from "/src/data/castle.js";
      import { draw } from "/src/render/draw.js";
      const q = new URLSearchParams(location.search);
      const TAG = q.get("tag") || "x", SC = Number(q.get("scale")) || 3;
      const FOES = (q.get("foes") || "goblin,goblin,orc,goblin").split(",").filter(Boolean);
      const N = Number(q.get("frames")) || 12, EVERY = Number(q.get("every")) || 6, WARM = Number(q.get("warm") ?? 1);
      const [CW, CH] = (q.get("crop") || "230,220").split(",").map(Number);
      selectRealm(q.get("realm") || "greenwood");
      selectFaction(q.get("faction") || "greenwood");
      const castle = emptyWorks();
      for (const kv of (q.get("works") || "wizards:3").split(",").filter(Boolean)) { const [k, v] = kv.split(":"); castle[k] = Number(v); }
      const g = {
        run: { kills: 0, goldEarned: 0, towersBuilt: 0, leaks: 0 }, gold: 1e7, lives: CASTLE_HP, wave: 1, freeplay: true, phase: "combat",
        towers: [], enemies: [], projectiles: [], effects: [], spawnQueue: [], spawnTimer: 0, speed: 1, paused: false,
        selectedId: null, buildMode: null, hover: null, time: 0, shake: 0, snapshot: null, castle,
        cam: { zoom: 1, x: 0, y: 0 }, buildUntil: null, buildMenuOpen: false, victory: false, rush: false, bands: [], militiaCd: 0,
      };
      const [gx, gy] = PTS[PTS.length - 1];
      g.phase = "build"; updateGame(g, 1 / 60); g.phase = "combat";   // (the Masons' barricades go up in a build phase)
      FOES.forEach((type, i) => spawnAt(g, type, 1, TOTAL_LEN - Number(q.get("back") ?? 140) - i * 14, 0));
      for (const kv of (q.get("set") || "").split(",").filter(Boolean)) { const [k, v] = kv.split(":"); for (const e of g.enemies) { e[k] = Number(v); if (k === "hp") e.maxHp = Number(v); } }
      const DT = 1 / 60;
      for (let i = 0; i < WARM * 60; i++) updateGame(g, DT);
      const cols = Math.min(4, N), rows = Math.ceil(N / cols);
      const out = document.createElement("canvas"); out.width = CW * SC * cols; out.height = (CH + 12) * SC * rows;
      const o = out.getContext("2d"); o.imageSmoothingEnabled = false; o.fillStyle = "#20242c"; o.fillRect(0, 0, out.width, out.height);
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      for (let f = 0; f < N; f++) {
        draw(g, cv, { current: null });
        const k = cv.width / W, cx = W - CW, cy = Math.max(0, Math.min(H - CH, gy - CH * 0.55));
        const col = f % cols, row = Math.floor(f / cols);
        o.drawImage(cv, cx * k, cy * k, CW * k, CH * k, col * CW * SC, row * (CH + 12) * SC + 12 * SC, CW * SC, CH * SC);
        o.fillStyle = "#e8e0c8"; o.font = `${6 * SC}px monospace`; o.fillText(`${g.time.toFixed(3)}s`, col * CW * SC + 4, row * (CH + 12) * SC + 9 * SC);
        for (let i = 0; i < EVERY; i++) updateGame(g, DT);
      }
      await fetch(`/__shot?name=workslab_${TAG}`, { method: "POST", body: out.toDataURL("image/png").slice(22) });
      document.title = "DONE"; document.getElementById("status").textContent = `saved .shots/workslab_${TAG}.png`;
    </script>
  </body>
</html>
