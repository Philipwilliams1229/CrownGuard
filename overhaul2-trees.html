        SWAY, LOOP, lean, FILLS, fillVar, fireflyLoop, leafFall, leafLitter, snowLoop, snowSlide, bfly, LIFE2, ROUTINE } from "/concept/overhaul2-trees.js";
      import { nightTick, clearLamps, swapLamps, drawLampPools, drawLampBloom } from "/src/render/nightlight.js";
      const q = new URLSearchParams(location.search), DT = 1 / 60;
      // ROUND 4, the animated loops: ?anim=<name> (art/briefs/overhaul-animation.md) -> .shots/ovh3_anim_<name>_c5r8_fps10.png
      //   trees_meadow | willow_water | wood_edge_day | wood_edge_dusk | autumn_leaves | winter;  ?mode=wildlife for the creatures' sheet
      const ANIMS = { trees_meadow: ["m", "summer", "noon"], willow_water: ["w", "summer", "noon"], wood_edge_day: ["e", "summer", "noon"],
                      wood_edge_dusk: ["e", "summer", "dusk"], autumn_leaves: ["m", "autumn", "noon"], winter: ["m", "winter", "noon"] };
      const ANIM = ANIMS[q.get("anim")] ? q.get("anim") : null, AN = ANIM ? ANIMS[ANIM] : null;
      const MODE = q.get("mode") || "board", SCENE = AN ? AN[0] : q.get("scene") || "1", OPTN = AN ? "final" : q.get("opt") || "today";
      const SEASON = AN ? AN[1] : q.get("season") || "summer", SUN = AN ? AN[2] : q.get("sun") || "noon";
      // smooth value noise (bilinear, smoothstepped) for the snow cover
      const vnoise = (x, y, sd) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
        const a = h2(xi, yi, sd), b = h2(xi + 1, yi, sd), c = h2(xi, yi + 1, sd), d = h2(xi + 1, yi + 1, sd); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
      const save = async (name, cv) => { await fetch(`/__shot?name=${name}`, { method: "POST", body: cv.toDataURL("image/png").slice(22) }); document.title = "DONE"; document.getElementById("status").textContent = "saved " + name + " | " + LOG.join(" | "); };
      const LOG = [];
      window.runAll = async (qs) => { const out = []; for (const q2 of qs) { const f = document.createElement("iframe"); f.style.width = "50px"; f.src = "/overhaul2-trees.html?" + q2 + "&t=" + Date.now(); document.body.appendChild(f); let ok = false; for (let i = 0; i < 160 && !ok; i++) { await new Promise((r) => setTimeout(r, 500)); try { ok = f.contentDocument.title === "DONE"; } catch (e) {} } out.push(q2 + " => " + (ok ? f.contentDocument.getElementById("status").textContent.slice(0, 300) : "TIMEOUT " + (f.contentDocument?.getElementById("status")?.textContent || ""))); f.remove(); } return out; };
      window.sheet = async (names, crop, cols, outName) => { const [x, y, w, h] = crop; const ims = await Promise.all(names.map((n) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = "/.shots/" + n + ".png?" + Date.now(); }))); const rows = Math.ceil(ims.length / cols); const c = document.createElement("canvas"); c.width = w * cols; c.height = h * rows; const cx = c.getContext("2d"); ims.forEach((im, i) => { const X = (i % cols) * w, Y = Math.floor(i / cols) * h; cx.drawImage(im, x, y, w, h, X, Y, w, h); cx.fillStyle = "#000"; cx.fillRect(X, Y, 170, 26); cx.fillStyle = "#fff"; cx.font = "20px monospace"; cx.fillText(names[i].replace("ovh2_trees_", ""), X + 6, Y + 20); }); await fetch("/__shot?name=" + outName, { method: "POST", body: c.toDataURL("image/png").slice(22) }); return [c.width, c.height]; };
      if (MODE === "idle") {
        // a queue that survives the page being reloaded by other sessions' edits (localStorage)
        window.queue = (qs) => { localStorage.ovh2q = JSON.stringify(qs); localStorage.ovh2res = "[]"; pump(); };
        window.results = () => JSON.parse(localStorage.ovh2res || "[]").concat(JSON.parse(localStorage.ovh2q || "[]").map((x) => "PENDING " + x));
        const pump = async () => {
          if (window._pumping) return; window._pumping = true;
          for (;;) {
            const qs = JSON.parse(localStorage.ovh2q || "[]"); if (!qs.length) break;
            const r = await runAll([qs[0]]);
            const res = JSON.parse(localStorage.ovh2res || "[]"); res.push(r[0]); localStorage.ovh2res = JSON.stringify(res);
            localStorage.ovh2q = JSON.stringify(JSON.parse(localStorage.ovh2q || "[]").slice(1));
          }
          window._pumping = false;
        };

        document.title = "IDLE"; throw new Error("idle");
      }
      const T = TREAT[OPTN] || TREAT[3], pal = PAL[SEASON];

      // ---------------- strips ----------------
      if (MODE === "life") {
        const S = 6, cw = 50 * S, rowH = 46 * S;
        const out = document.createElement("canvas"); out.width = 4 * cw + 140; out.height = LIFE_STRIP.length * rowH;
        const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;

          const fr = LIFE[nm](1);

      }
      if (MODE === "willow2") {

        const cols = ["old", "spring", "summer", "autumn", "winter"], Z = 2.4, cw = Math.round(140 * Z), rh = Math.round(136 * Z);

        const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
        for (let f = 0; f < 3; f++) cols.forEach((cn, c) => {
          const sea = cn === "old" ? "summer" : cn;
          const cell = document.createElement("canvas"); cell.width = 140; cell.height = 136; const cc = cell.getContext("2d");
          cc.fillStyle = sea === "winter" ? "#d8dee6" : sea === "autumn" ? "#8aa040" : sea === "spring" ? "#74b444" : "#6aa83e"; cc.fillRect(0, 0, 140, 136);

          if (wet) { cc.fillStyle = "#3a6a9a"; cc.fillRect(0, 112, 50, 24); cc.fillStyle = "#4a7aa8"; cc.fillRect(0, 116, 46, 3); }

          const sp = SP.willow(PAL[sea], 1, 0, 0, 4 + f, T, { form: f, wet, old: cn === "old" });
          cc.drawImage(sp.cv, 70 - sp.ax, 122 - sp.ay);

          oc.fillStyle = "#20242c"; oc.fillRect(c * cw, f * rh, 144, 140); oc.drawImage(cell, c * cw + 2, f * rh + 2);
          oc.fillStyle = "#20242c"; oc.fillRect(c * cw + 150, f * rh + 4, 180, 22); oc.fillStyle = "#e8e0c8"; oc.font = "15px monospace";
          oc.fillText(`${["broad", "tall", "young"][f]} / ${cn === "old" ? "previous summer" : cn}`, c * cw + 154, f * rh + 20);
        });

      if (MODE === "willow" || MODE === "wsway") {

        const sway = MODE === "wsway", rows = sway ? [["summer", [0, 2, 3, 1]]] : [["summer"], ["autumn"], ["winter"]];
        const cols = sway ? 4 : 3, S6 = sway ? 3 : 3, cw = 140 * S6, rh = 136 * S6;
        const out = document.createElement("canvas"); out.width = cols * cw; out.height = rows.length * (rh + 150);
        const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
        rows.forEach(([sea, sv], r) => {
          for (let c = 0; c < cols; c++) {
            const cell = document.createElement("canvas"); cell.width = 140; cell.height = 136; const cc = cell.getContext("2d");
            cc.fillStyle = sea === "winter" ? "#d8dee6" : sea === "autumn" ? "#8aa040" : "#6aa83e"; cc.fillRect(0, 0, 140, 136);
            const wet = c === 0 || sway ? -1 : 0;

            const sp = SP.willow(PAL[sea], 1, sway ? sv[c] : 0, 0, sway ? 4 : 4 + c, T, { form: sway ? 0 : c, wet });

            oc.fillStyle = "#e8e0c8"; oc.font = "18px monospace"; oc.fillText(sway ? `frame ${c + 1}` : `${["broad old, waterside", "tall narrow", "young"][c]} / ${sea}`, X + 300, Y + rh + 30);
          }

        await save(sway ? "ovh2_trees_willow_sway" + (q.get("v") || "") : "ovh2_trees_willow_sheet", out);

      }
      if (MODE === "leaves") {
        const out = document.createElement("canvas"); out.width = 4 * 400; out.height = 520;
        const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
        const ap = PAL.autumn, cols = ["#c86a2a", "#d8a840", "#a8442a", "#e0b048"];
        for (let f = 0; f < 4; f++) {
          const cell = document.createElement("canvas"); cell.width = 200; cell.height = 170; const cc = cell.getContext("2d");
          cc.fillStyle = "#8aa040"; cc.fillRect(0, 0, 200, 170);
          for (let n = 0; n < 900; n++) { cc.fillStyle = ["#7c9638", "#96aa48", "#86a03c"][n % 3]; cc.fillRect((h2(n, 1, 3) * 200) | 0, (h2(n, 2, 3) * 170) | 0, 2, 1); }
          standRing(cc, 100, 158, 46, 5, "autumn");
          const sp = SP.oak(ap, 0.85, [0, 1, 2, 1][f], 0, 11, T);

      // ---------------- round 4: the creatures' loops at 4x on plain grass (one sheet) ----------------
      if (MODE === "wildlife") {

        const fc = document.createElement("canvas"); fc.width = 4 * CW; fc.height = 2 * CH; const fx = fc.getContext("2d");
        const deer = LIFE.deer(1), rab = { 1: LIFE.rabbit(1), "-1": LIFE.rabbit(-1) }, fox = LIFE.fox(1), owl = LIFE.owl(), sq = LIFE.squirrel(2), bird = LIFE2.bird(-1), twig = LIFE2.twig(), trunk = LIFE2.trunk();
        const grass = (x, y, w, h, dark) => { fx.fillStyle = dark ? "#2c3a2e" : "#6aa83e"; fx.fillRect(x, y, w, h); for (let n = 0; n < w * h / 30; n++) { fx.fillStyle = dark ? "#34442f" : ["#62a03a", "#72b044", "#5e9a38"][n % 3]; fx.fillRect(x + ((h2(n, x, 3) * w) | 0), y + ((h2(n, y + 1, 3) * h) | 0), 2, 1); } };
        const put = (sp, X, Y) => fx.drawImage(sp.cv, Math.round(X - sp.ax), Math.round(Y - sp.ay));

          cell(2, 0, 1, () => { grass(2 * CW, 0, CW, CH); put(twig, 2 * CW + 26, 36); const R = ROUTINE.bird(f); if (R) put(bird[R.n], 2 * CW + 28 + R.x * 0.5, 33 + R.y * 0.5 - (R.hop ? 1 : 0)); });

      if (MODE === "fillsheet" || MODE === "fillwinter") {

        const Z = 3, CW = 180, CH = 168, sd0 = 40, NF = FILLS.length;

        kinds.forEach(([sp, k, ord], r) => { for (let c = 0; c < NF; c++) {

          oc.fillStyle = "rgba(32,36,44,0.85)"; oc.fillRect(X + 4, Y + 4, 330, 22); oc.fillStyle = "#f4ecd8"; oc.font = "16px monospace";
          oc.fillText(`${sp} / ${FILLS[c]}${FS ? " / layers " + (ord ? "b" + (1 + (c % 2)) : "a") : " / " + sea}`, X + 8, Y + 20);
          oc.fillStyle = "#20242c"; oc.fillRect(X + CW * Z - 2, Y, 2, CH * Z); oc.fillRect(X, Y + CH * Z - 2, CW * Z, 2);
        } });
        document.body.appendChild(out);
        await save(FS ? "ovh2_trees_fill_sheet" : "ovh2_trees_fill_winter", out);
        throw new Error("done");
      }
      if (MODE === "trunks") {
        const kinds = [["roundoak", 0.9, 1], ["oak", 0.85, 2], ["beech", 0.85, 3], ["hawthorn", 0.9, 4], ["birches", 0.85, 5], ["willow", 0.9, 6], ["pine", 1, 7]];
        const Z = 4, CW = 180, CH = 168, cw = 120, ch = 128, cols = [];
        for (let f = 0; f < 4; f++) for (const sea of ["summer", "winter"]) cols.push([f, sea]);
        const out = document.createElement("canvas"); out.width = cols.length * cw * Z; out.height = kinds.length * ch * Z; const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
        const FL = ["buttress", "long root", "collar", "split toes"];
        kinds.forEach(([sp, k, sd], r) => cols.forEach(([f, sea], c) => {
          const cell = document.createElement("canvas"); cell.width = CW; cell.height = CH; const cc = cell.getContext("2d");
          cc.fillStyle = sea === "winter" ? "#d8dee6" : "#6aa83e"; cc.fillRect(0, 0, CW, CH);
          for (let n = 0; n < 500; n++) { cc.fillStyle = sea === "winter" ? ["#cdd4de", "#e4e8ee"][n % 2] : ["#62a03a", "#72b044", "#5e9a38"][n % 3]; cc.fillRect((h2(n, 1, 3) * CW) | 0, (h2(n, 2, 3) * CH) | 0, 2, 1); }
          standRing(cc, CW / 2, CH - 12, (REACH[sp] || REACH.oak)[1] * 2 * k * 0.95 * 0.5, sd * 7 + f, sea, sp === "pine");
          const spr = SP[sp](PAL[sea], k, 0, 0, sd * 10 + f, TREAT.final, { flare: f, fill: 0, order: 0 });
          cc.drawImage(spr.cv, CW / 2 - spr.ax, CH - 10 - spr.ay);

        if (SEASON === "autumn") { const r = rng(4); for (let n = 0; n < 500; n++) { const x = cx0 + r() * cw, y = cy0 + r() * ch; if (nearestOnPath(x, y).d < PATH_HALF - 4) { if (r() < 0.8) continue; } if (underPine(x, y)) continue; ctx.fillStyle = ["#c86a2a", "#d8a840", "#a8442a"][n % 3]; ctx.fillRect(Math.round(x * 2), Math.round(y * 2), 2, 1); } }
      }
      // small life (never on the road)
      const lifeItems = [];
      for (const [nm, x, y, fl] of OPTN === "today" || ANIM ? [] : sc.life || []) {
        if (nearestOnPath(x, y).d < PATH_HALF + 10) { LOG.push("life off road: " + nm); continue; }
        if (nm === "owl" && SUN !== "dusk") continue;
        if ((nm === "butterfly") && (SEASON === "winter" || SUN === "dusk")) continue;
        const fr = LIFE[nm](fl); lifeItems.push({ spr: fr[(x | 0) % fr.length], x, y: nm === "owl" ? y + 400 : y, life: true, oy: nm === "owl" ? 400 : 0 });
      }
      // shadows (one mask), then everything back to front
      const all = [...items, ...lifeItems];
      if (ANIM) { await animate(); throw new Error("done"); }
      if (OPTN !== "today") layShadows(ctx, all.filter((it) => !it.life).map((it) => ({ sp: it.spr, px: Math.round(it.x * 2), py: Math.round(it.y * 2) })), 1680, 1120, 0.12);
      all.sort((a, b) => a.y - b.y);
      for (const it of all) ctx.drawImage(it.spr.cv, Math.round(it.x * 2 - it.spr.ax), Math.round((it.y - (it.oy || 0)) * 2 - it.spr.ay));
      if (SEASON === "autumn" && OPTN !== "today") fallingLeaves(ctx, cx0 * 2 + 150, cy0 * 2 + 80, 700, 260, 3, 1, ["#e0742a", "#f0c040", "#c8442a", "#f4d060"], 40);
      // ---- dusk: the board sinks into blue; warm lights (windows, torches) are kept; fireflies under the trees ----
      if (SUN === "dusk") {
        // a real dusk (round 3): a lighter blue-violet than night, rosier in the west; the halls' torches throw
        // their pools and blooms (the game's own nightlight.js), fireflies along the wood's edge
        duskShade(ctx, cx0 * 2, cw * 2);
        ctx.setTransform(2, 0, 0, 2, 0, 0);
        drawLampBloom(ctx, g.time); swapLamps(); drawLampPools(ctx, g.time);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const pts = []; const r = rng(31);
        for (const [x, y] of sc.flies) for (let n = 0; n < 6; n++) pts.push([(x + (r() - 0.5) * 40) * 2, (y + (r() - 0.5) * 22 - 6) * 2]);
        fireflies(ctx, pts, 5);
      }
      // ---------- ROUND 4: the loop ----------
      async function animate() {
        const A = sc.anim, [x0, y0, w0, h0] = sc.crop, FW = w0 * 2, FH = h0 * 2, NF = LOOP.F, COLS = 5, ROWS = NF / COLS;
        layShadows(ctx, items.map((it) => ({ sp: it.spr, px: Math.round(it.x * 2), py: Math.round(it.y * 2) })), 1680, 1120, 0.12);
        const inCrop = (it) => it.x > x0 - 70 && it.x < x0 + w0 + 70 && it.y > y0 - 10 && it.y < y0 + h0 + 150;
        const live = items.filter(inCrop);
        // who sways: lone trees and the wood's front row (the deep rows stand still); bushes and ferns hold
        for (const it of live) { it.sways = it.sp !== "bush" && it.sp !== "fern" && (it.lone || (A.front && it.dk === 0)); it.ph = h2(it.seed, 3, 9) * 0.12; it.poses = new Set(); }
        const byName = (nm) => live.find((it) => it.sp === nm && it.lone);
        // autumn: leaves off the broadleaves, each settling on a twin laid in the litter now
        const leaves = [];
        if (SEASON === "autumn") {
          const r = rng(12), cols = ["#ff8a30", "#ffd448", "#e8502c", "#fff070"];
          for (const it of live) if (it.lone && it.sp !== "pine" && it.sp !== "bush") {
            const n = it.sp === "hawthorn" ? 5 : 11, R = (REACH[it.sp] || REACH.oak)[1] * it.k * 2;
            for (let i = 0; i < n; i++) {
              const sx = it.x * 2 + (r() - 0.5) * R * 1.4, sy = it.y * 2 - (REACH[it.sp] || REACH.oak)[0] * it.k * 2 * (0.7 + r() * 0.5);
              const lx = sx + (r() - 0.2) * 34, ly = it.y * 2 + (r() - 0.3) * 26;
              if (nearestOnPath(lx / 2, ly / 2).d < PATH_HALF - 4) continue;
              leaves.push({ x0: sx, y0: sy, x1: lx, y1: ly, ph: (i / n + r() * 0.12) % 1, n: i, col: cols[(i + it.seed) % 4] });
            }
          }
          leafLitter(ctx, leaves);
        }
        const base = ctx.getImageData(x0 * 2, y0 * 2, FW, FH);
        const fc = document.createElement("canvas"); fc.width = FW; fc.height = FH; const fx = fc.getContext("2d"); fx.imageSmoothingEnabled = false;
        const sheet = document.createElement("canvas"); sheet.width = FW * COLS; sheet.height = FH * ROWS; const shx = sheet.getContext("2d");
        const scratch = document.createElement("canvas"); scratch.width = 1680; scratch.height = 1120;
        const LF = {}; const lifeF = (nm, fl) => (LF[nm + fl] ||= (LIFE2[nm] || LIFE[nm])(fl));
        const wood = (x, y) => live.filter((it) => it.dk === 0 && /oak|beech/.test(it.sp)).sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0];
        const sq = A.squirrel ? wood(...A.squirrel) : null;
        LOG.push("willows " + live.filter((it) => it.sp === "willow").map((it) => `${Math.round(it.x)},${Math.round(it.y)} wet ${it.o && it.o.wet}`).join(" "));
        const bake = { n: 0, ms: 0 };
        for (let f = 0; f < NF; f++) {
          const t = f / LOOP.fps;
          fx.setTransform(1, 0, 0, 1, 0, 0); fx.putImageData(base, 0, 0); fx.setTransform(1, 0, 0, 1, -x0 * 2, -y0 * 2);
          const draws = [];
          for (const it of live) {
            let spr = it.spr;
            if (it.sways) {
              // the gust crosses the scene left to right (one wave every 160 units: neighbours lean a beat apart);
              // each mass of a crown on its own small delay
              SWAY.at = (i) => A.sway * (SEASON === "winter" ? 0.55 : 1) * (it.sp === "pine" ? 0.7 : 1) * (it.dk ? 0.8 : 1) * lean(t / LOOP.secs - it.x / 160 - it.ph - 0.07 * i);
              SWAY.t = t; SWAY.log = []; const T0 = performance.now();
              spr = SP[it.sp](pal, it.k, 0, it.dk, it.seed, it.T, it.o || {});
              bake.ms += performance.now() - T0; bake.n++;
              it.poses.add(SWAY.log.join(",")); SWAY.at = null; SWAY.t = null; SWAY.log = null;
            }
            draws.push({ y: it.y, cv: spr.cv, x: Math.round(it.x * 2 - spr.ax), yy: Math.round(it.y * 2 - spr.ay) });
          }
          const put = (y, sp, X, Y) => draws.push({ y, cv: sp.cv, x: Math.round(X - sp.ax), yy: Math.round(Y - sp.ay) });
          for (const [x, y, fl] of A.deer || []) put(y, lifeF("deer", fl)[ROUTINE.deer((f + (fl > 0 ? 0 : 17)) % NF).n], x * 2, y * 2);
          for (const [x, y] of A.rabbit || []) { const R = ROUTINE.rabbit(f); put(y, lifeF("rabbit", R.flip)[R.n], x * 2 + R.dx, y * 2); }
          if (sq && SUN !== "dusk") { const R = ROUTINE.squirrel(f); if (R) put(999, lifeF("squirrel", 2)[R.n], sq.x * 2 + 5, sq.y * 2 - 4 + R.dy); }
          if (A.owl && SUN === "dusk") put(A.owl[1] + 400, lifeF("owl", 1)[ROUTINE.owl(f).n], A.owl[0] * 2, A.owl[1] * 2);
          if (A.bird && SUN !== "dusk" && SEASON !== "winter") { const h = byName(A.bird), R = ROUTINE.bird(f); if (h && R) put(400, lifeF("bird", -1)[R.n], h.x * 2 + 6 + R.x, h.y * 2 - 66 * h.k + R.y - (R.hop ? 1 : 0)); }
          draws.sort((a, b) => a.y - b.y);
          for (const d of draws) fx.drawImage(d.cv, d.x, d.yy);
          if (SUN !== "dusk" && SEASON !== "winter") for (const [x, y, ph] of A.bfly || []) { const R = ROUTINE.bfly(f, ph); bfly(fx, x * 2 + R.dx, y * 2 + R.dy, R.n); }
          if (leaves.length) leafFall(fx, leaves, t);
          if (SEASON === "winter") {
            const p = A.slide && byName(A.slide); if (p) snowSlide(fx, p.x * 2 + 10 * p.k, p.y * 2 - 44 * p.k, t, 1.2, Math.round(42 * p.k));
            snowLoop(fx, x0 * 2, y0 * 2, FW, FH, t, 150, 5);
          }
          if (SUN === "dusk") {
            fx.setTransform(1, 0, 0, 1, 0, 0); duskShade(fx, 0, FW);
            clearLamps(); nightTick(g.time); draw(g, scratch, { current: null });   // the halls note their torches again (time held)
            fx.setTransform(2, 0, 0, 2, -x0 * 2, -y0 * 2);
            drawLampBloom(fx, g.time + t); swapLamps(); drawLampPools(fx, g.time + t);
            fx.setTransform(1, 0, 0, 1, -x0 * 2, -y0 * 2);
            const pts = []; const r = rng(31);
            for (const [x, y] of A.flies || []) for (let n = 0; n < 8; n++) { const px = x + (r() - 0.5) * 44, py = y + (r() - 0.5) * 22 - 6; if (nearestOnPath(px, py).d > PATH_HALF + 4) pts.push([px * 2, py * 2]); }
            fireflyLoop(fx, pts, 5, t);
          }
          shx.drawImage(fc, (f % COLS) * FW, Math.floor(f / COLS) * FH);
          if (f === 0) await fetch(`/__shot?name=ovh3_anim_${ANIM}_still`, { method: "POST", body: fc.toDataURL("image/png").slice(22) });
          document.getElementById("status").textContent = "frame " + f;
        }
        const poses = live.filter((it) => it.sways).map((it) => it.sp + ":" + it.poses.size);
        LOG.push(`${live.length} items, ${poses.length} sway, poses ${poses.join(" ")}, bakes ${bake.n} avg ${(bake.ms / Math.max(1, bake.n)).toFixed(1)} ms`);
        document.body.appendChild(sheet);
        await save(`ovh3_anim_${ANIM}_c${COLS}r${ROWS}_fps${LOOP.fps}`, sheet);
      }
      // ---------- crop and save ----------
      const out = document.createElement("canvas"); out.width = MODE === "full" ? 1680 : cw * 4; out.height = MODE === "full" ? 1120 : ch * 4;
      const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
      oc.drawImage(cv, cx0 * 2, cy0 * 2, cw * 2, ch * 2, 0, 0, out.width, out.height);
      document.body.appendChild(out);
      LOG.push(`${items.length} trees`);
      await save(MODE === "full" ? `ovh2_trees_full_${q.get("realm")}` : `ovh2_trees_${SCENE}_${OPTN}${q.get("suffix") || ""}`, out);
    </script>
  </body>
