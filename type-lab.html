<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Type lab</title>
<!--
  The type lab: every font identity in src/ui/fonts.js, side by side.
    /type-lab.html                  every option, one specimen sheet each
    /type-lab.html?opt=<id>         one option's sheet (what scripts/type-shots.mjs
                                    saves as .shots/type_<id>_sheet.png)
    /type-lab.html?survey=1         candidate faces, raw, with their metrics
                                    against today's faces (for tuning sizes)
    /type-lab.html?digits=1[&faces=A,B]   the digit test at true pixels
    /type-lab.html?candidates=1[|id,id]   pixel word faces for Tidy HUD, the
                                    owner's strings at the HUD's sizes (self-
                                    hosted ones load from /fonts/<file>: the
                                    survey's raw files, which public/fonts/
                                    doesn't hold, so route them in; a row
                                    whose files are missing says "not
                                    bundled" and shows nothing)
    /type-lab.html?words=pair,tidy2,tidy3   the owner's words (TWIN ARCHERS,
                                    WEAK, WAVE, WAR COUNCIL...) in each
                                    option's own faces, at the HUD's sizes
                                    and the phone's 0.72 (type-shots --words)
    /type-lab.html?distinct=1[&opts=a,b][&faces=A,B]   the digit pair test
                                    (scripts/type-shots.mjs --pairs)
  (?opt, not ?type: ?type would also switch the game's own option.)
  The sheets use the real hud.css classes; each sheet sets its option's
  variables on itself, and its canvas text asks for the option's stacks.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" />
<style>
  html, body { margin: 0; background: #17121b; color: #e8e0c8; }
  body { padding: 16px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid #3a3440; align-items: center; }
  .nm { font: 12px monospace; color: #b9ab93; }
  .nm b { color: #f0d27a; font-size: 13px; }
  .met { font: 10px monospace; color: #8a8090; }
  .dig { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .mark { color: #f2cf4a; letter-spacing: 3px; text-shadow: 0 3px 0 #9a7424, 0 5px 0 #10131a, 3px 5px 0 #10131a; }
  .tale { max-width: 300px; font-size: 10.5px; line-height: 1.4; }

  /* the specimen sheet */
  .sheet { width: 1100px; box-sizing: border-box; padding: 18px 20px 22px; margin-bottom: 24px; background: #20242c; border: 3px solid #0d0a10; }
  .sheet-head { display: flex; align-items: baseline; gap: 14px; font: 13px monospace; color: #b9ab93; margin-bottom: 14px; border-bottom: 1px solid #3a3440; padding-bottom: 8px; }
  .sheet-head b { font-size: 16px; color: #f0d27a; }
  .sheet-grid { display: grid; grid-template-columns: 430px 1fr; gap: 18px; }
  .title-card { background: linear-gradient(180deg, #3a4a7a 0%, #1c2450 100%); padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap { font: 10px monospace; color: #7d7488; margin: 10px 0 4px; letter-spacing: 1px; }
  .cap:first-child { margin-top: 0; }
  .flexr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import "/src/ui/hud/hud.css";
import { TYPES, TYPE_IDS, aliasOf, loadFaces, stacksOf, facesOf } from "/src/ui/fonts.js";
import { drawFloatText } from "/src/render/fx.js";
// fonts.js also applied the game's remembered option to this page: each sheet
// sets its own option on itself, so clear the page-wide switches
delete document.documentElement.dataset.typeCaps;
delete document.documentElement.dataset.typeFeatures;
document.documentElement.style.removeProperty("font-feature-settings");
document.documentElement.style.removeProperty("font-synthesis");

const q = new URLSearchParams(location.search);
const out = document.getElementById("out");
const TALE = "Longbowmen on a timber tower. Slow, far and true: the first hall a realm needs, and the last to fall.";
const DIGITS = "0O 1lI 5S 8B 2Z 3469 7";

// ---- survey: candidate faces, raw ----
const CANDIDATES = [
  // pixel
  ["Silkscreen", [400, 700]], ["Press Start 2P"], ["Jersey 10"], ["Jersey 15"], ["Jersey 20"], ["Jersey 25"],
  ["Tiny5"], ["Micro 5"], ["VT323"], ["Handjet", [400, 700]], ["DotGothic16"], ["Workbench"],
  ["Jacquard 12"], ["Jacquard 24"], ["Jacquarda Bastarda 9"], ["Sixtyfour"], ["Bytesized"], ["Coral Pixels"],
  ["Doto", [400, 900]], ["Kode Mono", [400, 700]],
  // medieval / storybook
  ["Grenze Gotisch", [400, 700]], ["Grenze", [400, 700]], ["Cinzel", [400, 700]], ["Cinzel Decorative", [400, 700]],
  ["IM Fell English SC"], ["IM Fell English"], ["Alegreya SC", [400, 700]], ["Alegreya", [400, 700]],
  ["Alegreya Sans SC", [400, 700]], ["Almendra", [400, 700]], ["Almendra SC"], ["Pirata One"], ["UnifrakturMaguntia"],
  ["MedievalSharp"], ["New Rocker"], ["Uncial Antiqua"], ["Texturina", [400, 700]], ["Germania One"], ["Fondamento"],
  ["Metamorphous"], ["Cormorant SC", [500, 700]], ["Spectral SC", [400, 700]],
];

const metrics = (fam, w = 400) => {
  const c = document.createElement("canvas").getContext("2d");
  c.font = `${w} 100px ${fam}`;
  const m = (s) => c.measureText(s);
  const H = m("H"), x = m("x"), z = m("0");
  return {
    cap: H.actualBoundingBoxAscent, xh: x.actualBoundingBoxAscent, dig: z.actualBoundingBoxAscent + z.actualBoundingBoxDescent,
    wCaps: m("CROWNGUARD").width, wDig: m("0123456789").width, wTale: m(TALE).width,
  };
};
const f1 = (v) => v.toFixed(1);
// today's faces come from index.html's link: load them before measuring
const refsLoaded = () => Promise.all(['400 20px "Silkscreen"', '700 20px "Silkscreen"', '20px "Press Start 2P"']
  .map((f) => document.fonts.load(f, "AZ09")));
// Press Start 2P's effective scale under font-size-adjust 0.58, read off the DOM
const psScale = () => {
  const probe = (adj) => {
    const s = document.createElement("span");
    s.textContent = "0123456789";
    s.style.cssText = `font-family:"Press Start 2P";font-size:100px;position:absolute;visibility:hidden;white-space:nowrap;font-size-adjust:${adj}`;
    document.body.appendChild(s); const w = s.getBoundingClientRect().width; s.remove(); return w;
  };
  return probe("0.58") / probe("none");
};

async function survey() {
  const faces = CANDIDATES.map(([family, wght]) => ({ family, size: 1, wght: wght || [400] }));
  await loadFaces(faces); await refsLoaded();
  await document.fonts.ready;
  const ref = {
    silk: metrics(`"Silkscreen"`), silkB: metrics(`"Silkscreen"`, 700), ps2p: metrics(`"Press Start 2P"`),
    verd: metrics("Verdana, Geneva, sans-serif"), verdB: metrics("Verdana, Geneva, sans-serif", 700), mono: metrics("monospace", 700),
  };
  const psK = psScale();
  const refLine = (n, r, k = 1) => `<div class="met">${n}: cap ${f1(r.cap * k)} x ${f1(r.xh * k)} dig ${f1(r.dig * k)} | wCaps ${f1(r.wCaps * k)} wDig ${f1(r.wDig * k)} wTale ${f1(r.wTale * k)}</div>`;
  out.innerHTML = `<div class="nm">references (per 100px): Press Start 2P is shown at its 0.58-adjusted scale ${f1(psK * 100)}%</div>` +
    refLine("Silkscreen", ref.silk) + refLine("Silkscreen 700", ref.silkB) + refLine("PS2P@0.58", ref.ps2p, psK) +
    refLine("Verdana (here: its fallback)", ref.verd) + refLine("Verdana bold", ref.verdB) + refLine("monospace bold", ref.mono);
  for (const f of faces) {
    const fam = `'${aliasOf(f)}'`;
    const m = metrics(fam), mb = f.wght.length > 1 ? metrics(fam, f.wght[f.wght.length - 1]) : m;
    // suggested sizes: match the slot's reference height, never wider (+5%)
    const fit = (hMe, hRef, wMe, wRef) => Math.min(hRef / hMe, (wRef * 1.05) / wMe);
    const sug = {
      ui: fit(m.cap, ref.silk.cap, m.wCaps, ref.silk.wCaps),
      num: fit(m.dig, ref.ps2p.dig * psK, m.wDig, ref.ps2p.wDig * psK),
      body: fit(m.xh, ref.verd.xh, m.wTale, ref.verd.wTale),
      mark: fit(mb.cap, ref.verdB.cap, mb.wCaps, ref.verdB.wCaps),
      board: fit(mb.cap, ref.mono.cap, mb.wCaps, ref.mono.wCaps),
    };
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div class="nm"><b>${f.family}</b>${refLine("raw", m)}<div class="met">fit: ${Object.entries(sug).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(" · ")}</div></div>
      <div style="font-family:${fam}">
        <div class="dig">
          <span class="mark" style="font-size:40px;font-weight:700">CROWNGUARD</span>
          <span style="font-size:${21 * sug.num}px;color:#f0d27a">${DIGITS}</span>
          <span style="font-size:${21 * sug.num * 0.72}px;color:#f0d27a">${DIGITS}</span>
          <span style="font-size:${12 * sug.ui}px">UPGRADE · SELL · FIRST · STRONG</span>
        </div>
        <div class="tale" style="font-size:${10.5 * sug.body}px">${TALE}</div>
      </div>`;
    out.appendChild(row);
  }
}

// ?digits=opts: every option's own digit faces as the game sets them (its
// num and body stacks, its font features: canvas can't set those, so the
// pair test sees Grenze's and Alegreya's default hanging figures)
async function digitsOpts() {
  await Promise.all(TYPE_IDS.map((id) => loadFaces(facesOf(id)))); await refsLoaded(); await document.fonts.ready;
  const S = "0O 1lI 5S 8B 2Z 6.67/s 36/s 2.6s +9 1234567890 ×14 1x Lv 10";
  for (const id of TYPE_IDS) {
    const t = TYPES[id], st = stacksOf(id);
    const row = document.createElement("div"); row.className = "row"; row.style.gridTemplateColumns = "150px 1fr";
    const feat = t.features ? `font-feature-settings:${t.features.replace(/"/g, "'")};` : "";
    const line = (slot, px, extra = "") => `<div style="font-family:${st[slot].replace(/"/g, "'")};font-size:${px}px;${feat}${extra}">${S}</div>`;
    row.innerHTML = `<div class="nm"><b>${t.name}</b><br>num 21 / 15 / 12px<br>body 12.6px</div><div style="color:#f0d27a;text-shadow:1px 1px 0 #241a26;line-height:1.35">
      ${[21, 15, 12].map((px) => line("num", px, `font-size-adjust:${t.numAdjust || "none"}`)).join("")}
      <div style="color:#e8e0c8">${line("body", 10.5)}</div></div>`;
    out.appendChild(row);
  }
  document.body.dataset.ready = "1";
}
async function digits() {
  if (q.get("digits") === "opts") return digitsOpts();
  // the digit test at true pixels: each face at the size that matches today's
  // digit height, at 12px (card prices, small numbers), 15px (a phone chip)
  // and 21px (a chip). Shoot it at DPR 1 unhinted to see the worst case.
  const names = (q.get("faces") || "Press Start 2P,VT323,Jersey 10,Jersey 15,Doto:700,Coral Pixels,Handjet,Workbench,Kode Mono,Tiny5").split(",");
  const faces = names.map((fw) => { const [family, w] = fw.split(":"); return { family, size: 1, wght: [Number(w) || 400] }; });
  await loadFaces(faces); await refsLoaded(); await document.fonts.ready;
  const ref = metrics(`"Press Start 2P"`).dig * psScale();
  const S = "0O 1lI 5S 8B 2Z 6.67/s 36/s 2.6s +9 1234567890 x14 Lv 10";
  for (const f of faces) {
    const fam = `'${aliasOf(f)}'`, k = ref / metrics(fam, f.wght[0]).dig;
    const row = document.createElement("div"); row.className = "row"; row.style.gridTemplateColumns = "150px 1fr";
    row.innerHTML = `<div class="nm"><b>${f.family}</b> x${k.toFixed(2)}</div><div style="font-family:${fam};font-weight:${f.wght[0]};color:#f0d27a;text-shadow:1px 1px 0 #241a26;line-height:1.3">
      ${[21, 15, 12].map((px) => `<div style="font-size:${px * k}px">${S}</div>`).join("")}</div>`;
    out.appendChild(row);
  }
  document.body.dataset.ready = "1";
}

// ---- the specimen sheets ----
const INK = "#10131a";
const GUIDE = "The Iron Kingdom marches in step behind its levies. Three shield pips on every levy: only steel breaks them, and while one stands, magic glances off and fire, poison and cold do nothing. Bring muskets, blades and bolts.";

// canvas text the way the board paints it (draw.js banners; fx.js notices:
// drawn, thresholded to hard pixels, banded in three tones and inked)
function boardCanvas(st, id) {
  const S = 2, cw = 560, ch = 150;
  const cv = document.createElement("canvas");
  cv.width = cw * S; cv.height = ch * S; cv.style.width = cw + "px"; cv.style.height = ch + "px";
  const c = cv.getContext("2d");
  c.scale(S, S);
  c.fillStyle = "#6f9a48"; c.fillRect(0, 0, cw, ch);
  c.fillStyle = "#9a7a52"; c.fillRect(0, 96, cw, 26);
  const plain = !!TYPES[id].plain;
  const font = (px, bold) => {
    if (plain) return `${bold ? "bold " : ""}${px}px ${st.board}`;
    const f = TYPES[id].slots.board, w = bold ? f.wght[f.wght.length - 1] : f.wght[0];
    return `${w} ${px}px ${st.board}`;
  };
  // the wave banner (draw.js drawBanner)
  const cy = 34, hh = 20;
  c.fillStyle = "rgba(16,14,20,0.62)"; c.fillRect(0, cy - hh, cw, hh * 2);
  c.fillStyle = "rgba(216,179,74,0.85)"; c.fillRect(0, cy - hh, cw, 2); c.fillRect(0, cy + hh - 2, cw, 2);
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = "rgb(240,224,168)"; c.font = font(22, true);
  const chars = [..."WAVE 12"], gap = 22 * 0.72 + 5;
  let px = cw / 2 - ((chars.length - 1) * gap) / 2;
  for (const k of chars) { c.fillText(k, Math.round(px), cy - 7); px += gap; }
  c.font = font(11); c.fillStyle = "rgba(196,190,176,0.85)"; c.fillText("The Iron Kingdom · 34 foes", cw / 2, cy + 13);
  // a notice sprite (fx.js textSprite, the non-digit path)
  const sprite = (s, big) => {
    const fs = big ? 26 : 20, pad = 3;
    const m = document.createElement("canvas").getContext("2d"); m.font = font(fs, true);
    const w = Math.ceil(m.measureText(s).width) + pad * 2 + 4, h = Math.ceil(fs * 1.25) + pad * 2;
    const o = document.createElement("canvas"); o.width = w; o.height = h;
    const x = o.getContext("2d", { willReadFrequently: true });
    x.font = font(fs, true); x.textBaseline = "middle"; x.textAlign = "center"; x.fillStyle = "#fff"; x.fillText(s, w / 2, h / 2 + 1);
    const img = x.getImageData(0, 0, w, h), d = img.data, top = h / 2 - fs * 0.4, bot = h / 2 + fs * 0.4;
    const T = [[255, 246, 200], [244, 204, 80], [208, 150, 42]];
    for (let y = 0; y < h; y++) {
      const k = T[y < top + (bot - top) * 0.3 ? 0 : y < top + (bot - top) * 0.72 ? 1 : 2];
      for (let xx = 0; xx < w; xx++) { const i = (y * w + xx) * 4; if (d[i + 3] > 110) { d[i] = k[0]; d[i + 1] = k[1]; d[i + 2] = k[2]; d[i + 3] = 255; } else d[i + 3] = 0; }
    }
    x.putImageData(img, 0, 0);
    // a 2px ink ring (inkOutline, roughly)
    const r = document.createElement("canvas"); r.width = w + 4; r.height = h + 4;
    const rc = r.getContext("2d");
    for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-2, -2], [2, 2], [-2, 2], [2, -2], [-1, 0], [1, 0], [0, -1], [0, 1]]) rc.drawImage(o, 2 + dx, 2 + dy);
    rc.globalCompositeOperation = "source-in"; rc.fillStyle = "#241a26"; rc.fillRect(0, 0, r.width, r.height);
    rc.globalCompositeOperation = "source-over"; rc.drawImage(o, 2, 2);
    return r;
  };
  c.imageSmoothingEnabled = false;
  const a = sprite("Boss incoming!", true), b = sprite("Castle wall +2", false);
  c.drawImage(a, 20, 66, a.width / 2 * 1.4, a.height / 2 * 1.4);
  c.drawImage(b, 214, 72, b.width / 2 * 1.4, b.height / 2 * 1.4);
  // the floating numbers: fx.js's own 5x7 bitmap, the same in every option
  drawFloatText(c, { text: "+12", x: 420, y: 92, ttl: 690, life: 700 });
  drawFloatText(c, { text: "-3", x: 500, y: 100, ttl: 690, life: 700, big: true }, true);
  // the hero's respawn count and PAUSED
  c.fillStyle = "rgba(20,16,20,0.6)"; c.fillRect(250, 128, 24, 9);
  c.fillStyle = "#e8d47a"; c.font = font(7, true); c.fillText("6s", 262, 133);
  c.font = font(24, true); c.fillText("* PAUSED *", 430, 132);
  return cv;
}

function mapSvg(st) {
  const text = (x, y, s, size, extra) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="bold" font-family='${st.map}' ${extra}>${s}</text>`;
  const rib = "I. THE GREENWOOD", rw = rib.length * 5.6 + 14;
  return `<svg width="420" height="92" viewBox="0 0 210 46" shape-rendering="crispEdges" style="background:#5c8ab0">
    <rect x="12" y="8" width="70" height="10" fill="#ead9aa" stroke="#2a1f1a" stroke-width="0.7"/>
    ${text(47, 8 + 5 + 6.8 * 0.36, "Foxmere Ford", 6.8, 'fill="#3b2a1c"')}
    <rect x="12" y="26" width="70" height="10" fill="#ead9aa" stroke="#2a1f1a" stroke-width="0.7"/>
    ${text(47, 26 + 5 + 6.8 * 0.36, "The Cairnfields", 6.8, 'fill="#3b2a1c"')}
    <rect x="98" y="16" width="${rw}" height="11" fill="#a8505c" stroke="#2a1f1a" stroke-width="0.9"/>
    ${text(98 + rw / 2, 16 + 5.5 + 2.9, rib, 8, 'letter-spacing="1.2" fill="#f2dc8a" stroke="#2a1f1a" stroke-width="1.6" paint-order="stroke"')}
  </svg>`;
}

function sheet(id) {
  const t = TYPES[id], st = stacksOf(id);
  const el = document.createElement("div");
  el.className = "sheet";
  // the option's variables, on the sheet (they beat :root's)
  const vars = { "--mark": st.mark, "--title": st.title, "--head": st.head, "--display": st.ui, "--menu": st.menu, "--numeric": st.num, "--body": st.body, "--map": st.map, "--num-adjust": t.numAdjust || "none" };
  for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
  if (!t.plain) el.style.fontSynthesis = "none";
  if (t.features) { el.style.fontFeatureSettings = t.features; el.dataset.typeFeatures = ""; }
  if (t.caps) el.dataset.typeCaps = "";
  const fams = t.plain ? ["Silkscreen", "Press Start 2P", "Verdana", "monospace"]
    : [...new Set([...Object.values(t.slots), ...(t.digits ? [t.digits] : [])].map((f) => f.family))];
  const menuBtn = (label, gold, sub) => `<button style="font-family:var(--menu);font-weight:bold;cursor:pointer;border:2px solid #241a26;border-radius:0;width:100%;text-align:center;padding:14px 12px;min-height:52px;font-size:14px;letter-spacing:2px;${gold
    ? "background:#b8902e;color:#2e2016;box-shadow:inset -3px -3px 0 #7e5f1c, inset 3px 3px 0 #ecc85c"
    : "background:#6b4a2e;color:#f2e6c4;box-shadow:inset -2px -2px 0 #43301e, inset 2px 2px 0 #8a6440"}">${label}${sub ? `<div style="font-size:9px;letter-spacing:1px;opacity:0.85;margin-top:4px;font-weight:normal">${sub}</div>` : ""}</button>`;
  const chips = `<div class="flexr">
      <div class="cg-panel cg-chip"><span style="width:18px;height:18px;background:#e8c14a;border:2px solid #241a26;border-radius:50%"></span><span class="cg-num" style="color:var(--gold-lt);min-width:34px">1250</span></div>
      <div class="cg-panel cg-chip"><span style="width:16px;height:14px;background:#e0574c;border:2px solid #241a26"></span><span class="cg-num" style="color:var(--cream)">18</span><span class="cg-display" style="font-size:13px;color:var(--muted);margin-left:-3px">/20</span></div>
      <div class="cg-panel" style="padding:6px 10px;display:flex;flex-direction:column;align-items:center"><span class="cg-label" style="font-size:10px;color:var(--muted)">Wave</span><b class="cg-num" style="font-size:15px;color:var(--cream)">12/40</b></div>
      <div class="cg-panel" style="padding:5px 9px;display:flex;flex-direction:column;align-items:center"><span class="cg-num" style="font-size:9px;color:var(--cream)">×14</span><span class="cg-display" style="font-size:10px;color:var(--cream)">1x</span></div>
      <span class="cg-num" style="font-size:21px;color:var(--gold-lt)">0O 1lI 5S 8B 2Z 6.67 +9</span>
    </div>`;
  const stats = `<div class="cg-parch" style="margin-top:10px;padding:7px 9px;font-size:10.5px;line-height:1.45;color:#5a4630">
        <div class="cg-label" style="margin-bottom:3px;color:#7a6446">Fully upgraded</div>
        Venom-dipped arrows: every hit stacks a poison that gnaws through armor and regeneration alike.
        <div style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:1px;margin-top:8px">
          ${[["Damage", "15"], ["Fire rate", "6.67/s"], ["Range", "130"], ["Poison", "+9/s a hit"], ["Poison max", "36/s"], ["Poison time", "2.6s"]]
            .map(([k, v]) => `<span style="color:#7a6446">${k}</span><b style="color:var(--parch-ink)">${v}</b>`).join("")}
        </div>
      </div>`;
  const card = `<div class="cg-frame" style="width:300px;padding:12px">
      <div class="cg-label" style="font-size:12px;margin-bottom:8px">Longbow Hall · Level 2</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button class="cg-btn" style="min-height:34px">First</button><button class="cg-btn" style="min-height:34px">Strong</button>
      </div>
      <button class="cg-btn cg-btn--parch" style="width:100%;margin-top:10px;padding:7px 10px 8px;justify-content:space-between;gap:10px">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0">

async function sheets(one) {
  const ids = one && TYPES[one] ? [one] : TYPE_IDS;
  // try a variation without touching fonts.js: &set=title:Grenze Gotisch:1:700,mark:...
  // (digits:Family:size to change the digits face, digits:none to drop it, caps:1 or caps:0)
  if (one && q.get("set") && !TYPES[one].plain) {
    for (const part of q.get("set").split(",")) {
      const [slot, family, size, w] = part.split(":");
      if (slot === "caps") { TYPES[one].caps = family === "1"; continue; }
      if (slot === "digits" && family === "none") { delete TYPES[one].digits; continue; }
      const f = { family, size: Number(size) || 1, wght: w ? w.split("-").map(Number) : [400], lacks: "" };
      if (slot === "digits") TYPES[one].digits = f; else TYPES[one].slots[slot] = f;
    }
  }
  await Promise.all(ids.map((id) => loadFaces(facesOf(id)))); await refsLoaded();
  await document.fonts.ready;
  for (const id of ids) {
    const { el, st } = sheet(id);
    el.querySelector(".board").appendChild(boardCanvas(st, id));

}

// ---- distinctness: how different each confusable pair is, in pixels ----
// ?distinct=1 lays every glyph of the confusable pairs out in the DOM, each
// alone in a cell, in the faces the game really uses (each option's num and
// body stacks, with its font features, today's font-size-adjust and the
// digits faces' unicode-ranges: a canvas can't do all of that), at the CSS
// sizes the game uses (12px: a card's prices and stat lines; 15px: a chip on
// a phone; 21px: a chip). scripts/type-shots.mjs --pairs screenshots the grid
// at DPR 1 and 2 (unhinted) and hands the picture back to scoreGlyphs(),
// which scores each pair: the share of ink the two glyphs do NOT share,
// counted in grey levels, not thresholded (a counter blurred half shut is
// half the same): 0 = the same glyph, 1 = nothing in common.
// Letters against digits, and digits against digits (a blurred 6 or 9 reads 8).
const PAIRS = ["0O", "1l", "1I", "5S", "8B", "2Z", "68", "98", "38", "08", "56", "17", "35"];
const SIZES = [12, 15, 21];
const CHARS = [...new Set(PAIRS.join(""))];
async function distinct() {
  await Promise.all(TYPE_IDS.map((id) => loadFaces(facesOf(id)))); await refsLoaded(); await document.fonts.ready;
  const rows = [];   // [name, family stack, css extras]
  const notes = [];  // (after the grid: type-shots --pairs shoots the first child)
  const only = q.get("opts") ? q.get("opts").split(",") : TYPE_IDS;
  for (const id of only) {
    const t = TYPES[id], st = stacksOf(id);
    const feat = t.features ? `font-feature-settings:${t.features};` : "";
    rows.push([`${id}.num`, st.num, `${feat}font-size-adjust:${t.numAdjust || "none"}`]);
    rows.push([`${id}.body`, st.body, feat]);
    // an option whose digits face draws the words' figures too: its letters
    // and digits meet in a label ("WAVE 10", "LEVEL 2")
    if (t.digits && !t.digits.only) rows.push([`${id}.ui`, st.ui, feat]);
  }
  if (q.get("faces")) {
    const faces = q.get("faces").split(",").map((fw) => { const [family, w] = fw.split(":"); return { family, size: 1, wght: [Number(w) || 400] }; });
    // a self-hosted candidate (the ?candidates sheet's CAND) loads from /fonts/
    const own = (f) => CAND.find((c) => c[1] === f.family && c[3] === "self");
    await loadFaces(faces.filter((f) => !own(f)));
    const missing = await loadCand(faces.map(own).filter(Boolean)); await document.fonts.ready;
    // each at the size that matches today's digit height
    const ref = metrics(`"Press Start 2P"`).dig * 0.77;
    for (const f of faces) {
      // (a candidate whose files aren't bundled would score the fallback face)
      if (own(f) && missing.has(own(f)[0])) { notes.push(`<div class="nm" style="color:#ff7a6a">${f.family}: not bundled (its files aren't in /fonts/), left out</div>`); continue; }
      const fam = own(f) ? candStack(own(f)) : `"${aliasOf(f)}"`, k = ref / metrics(fam, f.wght[0]).dig;
      rows.push([`${f.family}${f.wght[0] !== 400 ? ":" + f.wght[0] : ""} x${k.toFixed(2)}`, fam, `font-weight:${f.wght[0]}`, k]);
    }
  }
  const grid = document.createElement("div");
  grid.style.cssText = "position:relative;background:#000;color:#fff";
  const layout = [];
  let y = 0;
  for (const [name, fam, extra, k = 1] of rows) {
    for (const css of SIZES) {
      const px = css * k, w = Math.ceil(px * 1.6), h = Math.ceil(px * 2.2);
      const cells = {};
      CHARS.forEach((ch, i) => {
        const c = document.createElement("div");
        c.textContent = ch;
        c.style.cssText = `position:absolute;left:${i * w}px;top:${y}px;width:${w}px;height:${h}px;line-height:${h}px;text-align:center;font-family:${fam};font-size:${px}px;${extra}`;
        grid.appendChild(c);
        cells[ch] = [i * w, y, w, h];
      });
      layout.push({ name, css, cells });
      y += h;
    }
  }
  grid.style.height = `${y}px`; grid.style.width = `${CHARS.length * Math.ceil(21 * 1.6 * 1.6)}px`;
  out.appendChild(grid);
  out.insertAdjacentHTML("beforeend", notes.join(""));
  window.glyphLayout = layout;
  document.body.dataset.ready = "1";
}
// score the grid from a screenshot of it (a data URL) taken at `dpr`; draws the table
window.scoreGlyphs = async (url, dpr) => {
  const img = new Image(); img.src = url; await img.decode();
  const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height;
  const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(img, 0, 0);
  const ink = ([x, y, w, h]) => {
    const d = cx.getImageData(Math.round(x * dpr), Math.round(y * dpr), Math.round(w * dpr), Math.round(h * dpr)).data;
    const m = new Float32Array(d.length / 4);
    for (let i = 0; i < m.length; i++) m[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 765;
    return m;
  };
  const data = {};
  for (const { name, css, cells } of window.glyphLayout) {
    (data[name] ||= []).push(PAIRS.map(([a, b]) => {
      const A = ink(cells[a]), B = ink(cells[b]);
      let diff = 0, all = 0;
      for (let i = 0; i < A.length; i++) { diff += Math.abs(A[i] - B[i]); all += Math.max(A[i], B[i]); }
      return diff / Math.max(1e-6, all);
    }));
  }
  const cell = (v) => `<td style="color:${v < 0.2 ? "#ff7a6a" : v < 0.3 ? "#f0d27a" : "#9ad06a"}">${v.toFixed(2)}</td>`;
  out.innerHTML = `<div class="nm">devicePixelRatio ${dpr}, unhinted · red under 0.20, gold under 0.30</div><table class="nm" style="border-spacing:6px 3px">
    <tr><td></td>${SIZES.map((z) => `<td colspan="${PAIRS.length}">at ${z}px</td><td></td>`).join("")}</tr>
    <tr><td></td>${SIZES.map(() => PAIRS.map((p) => `<td>${p}</td>`).join("") + "<td>|</td>").join("")}</tr>
    ${Object.entries(data).map(([n, sc]) => `<tr><td><b>${n}</b></td>${sc.map((r) => r.map(cell).join("") + "<td>|</td>").join("")}</tr>`).join("")}</table>`;
  return { dpr, pairs: PAIRS, sizes: SIZES, data };
};

const LOCAL_FAMILY = (fam) => `cand ${fam}`;
// resolves to the ids of the self-hosted rows whose files didn't load (not

async function loadCand(rows) {
  const google = rows.filter((r) => r[3] === "google").map(([, family, wght]) => ({ family, size: 1, wght }));

    const fam = candStack(c), famA = fam.replace(/"/g, "'");
    if (missing.has(id)) {

    row.className = "row";

    row.style.cssText = "grid-template-columns:150px 1fr;align-items:start;padding:6px 0";

    row.style.fontSynthesis = "none";
    const wide = tw(fam, 10.5 * tf) / refW;
    row.innerHTML = `<div class="nm"><b>${family}</b><br>${lic} · ${src === "self" ? "self-hosted" : "Google"}<br>caps ${native} px · x${f}${bold ? "" : "<br><i>one weight</i>"}<br>tale x${tf}: ${(wide * 100).toFixed(0)}% of Jersey's width</div>
      <div class="cg-hud" style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;gap:10px;align-items:flex-start">${block("s1")}<div style="zoom:0.72">${block("s072")}</div></div>
        <div data-z="${id}:tale" style="display:flex;flex-direction:column;gap:3px;background:#e8d9b0;padding:5px 9px;color:#5a4630;width:560px">
          <span style="font-family:${famA};font-size:${(10.5 * tf).toFixed(2)}px;line-height:1.35">${TALE_C}</span>
          <span style="font-family:${famA};font-size:${(10.5 * tf).toFixed(2)}px;white-space:nowrap">Fire rate 1.33/s · Upgrade · Level 2 · twin wave weak sword</span>
        </div>
      </div>`;
    out.appendChild(row);
  }
  document.body.dataset.ready = "1";
}

// ---- the owner's words in each option (?words=pair,tidy2,tidy3) ----
// One row per option: its name, then the strings the owner named (the card's
// TWIN ARCHERS and ARCHER TOWER, WEAK, WAVE, WAR COUNCIL, SWORDS, RIVER
// WATCH, POWDER WORKS) in the option's own faces and slots at the HUD's
// sizes, again at the phone's 0.72, and the title screen's menu buttons.
// scripts/type-shots.mjs --words shoots it at DPR 1, 2 and 3.
async function words() {
  const ids = q.get("words") === "1" ? TYPE_IDS : q.get("words").split(",").filter((id) => TYPES[id]);
  await Promise.all(ids.map((id) => loadFaces(facesOf(id)))); await refsLoaded(); await document.fonts.ready;
  out.style.cssText = "display:flex;flex-direction:column;width:max-content";
  const menu = (label, gold) => `<button style="font-family:var(--menu);font-weight:bold;border:2px solid #241a26;border-radius:0;padding:12px 16px;min-width:200px;text-align:center;font-size:14px;letter-spacing:2px;${gold
    ? "background:#b8902e;color:#2e2016;box-shadow:inset -3px -3px 0 #7e5f1c, inset 3px 3px 0 #ecc85c"
    : "background:#6b4a2e;color:#f2e6c4;box-shadow:inset -2px -2px 0 #43301e, inset 2px 2px 0 #8a6440"}">${label}</button>`;
  for (const id of ids) {
    const t = TYPES[id], st = stacksOf(id);
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.words = id;
    row.style.cssText = "grid-template-columns:130px auto;align-items:start;padding:6px 0";
    const vars = { "--mark": st.mark, "--title": st.title, "--head": st.head, "--display": st.ui, "--menu": st.menu, "--numeric": st.num, "--body": st.body, "--map": st.map, "--num-adjust": t.numAdjust || "none" };
    for (const [k, v] of Object.entries(vars)) row.style.setProperty(k, v);
    if (!t.plain) row.style.fontSynthesis = "none";
    if (t.features) { row.style.fontFeatureSettings = t.features; row.dataset.typeFeatures = ""; }
    if (t.caps) row.dataset.typeCaps = "";
    row.innerHTML = `<div class="nm"><b>${t.name}</b><br>${id}</div>
      <div class="cg-hud" style="display:flex;gap:10px;align-items:flex-start">
        ${ownerWords(id, "s1", 1)}
        <div style="zoom:0.72">${ownerWords(id, "s072", 1)}</div>
        <div style="display:flex;flex-direction:column;gap:6px">${menu("NEW CAMPAIGN", true)}${menu("WAR COUNCIL", false)}</div>
      </div>`;
    out.appendChild(row);
  }
  document.body.dataset.ready = "1";
}

if (q.get("candidates")) candidates();
else if (q.get("words")) words();
else if (q.get("survey")) survey();
else if (q.get("distinct")) distinct();
else if (q.get("digits")) digits();
else sheets(q.get("opt"));
</script>
