<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crownguard frame picker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15171d;color:#d8dbe4;font:14px/1.35 system-ui,sans-serif;padding-bottom:70px}
#bar{position:sticky;top:0;z-index:5;background:#1e2230;border-bottom:1px solid #353b52;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar input[type=search]{flex:1;min-width:120px;height:36px;border-radius:6px;border:1px solid #444b66;background:#12141b;color:#fff;padding:0 10px;font-size:15px}
button{height:36px;min-width:44px;border-radius:6px;border:1px solid #555d7a;background:#2b3250;color:#fff;padding:0 12px;font-size:14px}
#count{font-weight:700;color:#ff8a8a}
#fallback{display:none;width:100%;height:120px;background:#0e1016;color:#fff;border:1px solid #f66}
details{margin:8px;border:1px solid #2c3146;border-radius:8px;background:#1a1d27}
summary{padding:10px;font-weight:700;cursor:pointer;min-height:36px}
details.fig{margin:6px 8px;background:#1f2330}details.fig summary{font-weight:600}
.clip{padding:4px 10px 8px}.clip h4{margin:6px 0 4px;font-size:12px;color:#9aa3c4;font-weight:600}
.frames{display:flex;flex-wrap:wrap;gap:6px}
.fr{display:flex;flex-direction:column;align-items:stretch;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fr .im{border:3px solid transparent;border-radius:4px;image-rendering:pixelated;background-repeat:no-repeat}
.fr.on .im{border-color:#ff2a2a;box-shadow:0 0 0 1px #ff2a2a}
.fr .lb{font-size:11px;text-align:center;color:#aab;min-height:16px}.fr.on .lb{color:#ff8a8a;font-weight:700}
.fr input{display:none;width:100%;min-width:90px;height:32px;font-size:13px;background:#0e1016;color:#fff;border:1px solid #f66;border-radius:4px;padding:0 4px}
.fr.on input{display:block}
.tag{font-weight:400;color:#8b93b3;font-size:12px}
</style></head><body>
<div id="bar"><input id="q" type="search" placeholder="Search figures..."><span id="count">0 frames flagged</span><button id="copy">Copy</button><button id="clear">Clear</button><textarea id="fallback" readonly></textarea></div>
<div id="root"></div>
<script>
const M = /*MANIFEST*/[];
const SCALE = 0.67, ORDER = ["Heroes","Your soldiers","Iron","Hollow","Rime","Greenwood horde","Other"];
let flags = {};
try { flags = JSON.parse(localStorage.getItem("cg-frame-flags") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("cg-frame-flags", JSON.stringify(flags)); } catch (e) {} };
const root = document.getElementById("root"), count = document.getElementById("count");
const upd = () => { const n = Object.keys(flags).length; count.textContent = n + " frame" + (n === 1 ? "" : "s") + " flagged"; save(); };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const byFig = {};
for (const m of M) (byFig[m.fig] ||= { name: m.name, group: m.group, fig: m.fig, clips: [] }).clips.push(m);
const groups = {};
for (const f of Object.values(byFig)) (groups[f.group] ||= []).push(f);
for (const g of ORDER) {
  if (!groups[g]) continue;
  const gd = el("details"); gd.open = g === "Heroes";
  gd.appendChild(el("summary", "", g + " (" + groups[g].length + ")"));
  for (const f of groups[g]) {
    const fd = el("details", "fig"); fd.dataset.s = (f.name + " " + f.fig).toLowerCase();
    const sm = el("summary", "", f.name); const tg = el("span", "tag", "  " + f.fig); sm.appendChild(tg); fd.appendChild(sm);
    let built = false;
    const build = () => {
      if (built) return; built = true;
      for (const c of f.clips) {
        const cd = el("div", "clip"); cd.appendChild(el("h4", "", c.clip + (c.aim ? " aim " + c.aim : "") + " (" + c.n + " frames)"));
        const fr = el("div", "frames");
        for (let i = 0; i < c.n; i++) {
          const key = [c.fig, c.clip, c.aim, i].join("|");
          const w = Math.round(c.cellW * SCALE), h = Math.round(c.cellH * SCALE);
          const d = el("div", "fr"), im = el("div", "im");
          im.style.cssText = `width:${w + 6}px;height:${h + 6}px;background-image:url(${c.file});background-size:${w * c.n}px ${h}px;background-position:${-i * w - 3}px -3px;background-origin:border-box;background-clip:border-box`;
          im.style.backgroundPosition = `${-i * w}px 0px`;
          im.style.width = w + "px"; im.style.height = h + "px"; im.style.boxSizing = "content-box";
          const lb = el("div", "lb", c.clip + (c.aim ? "@" + c.aim : "") + " " + i), note = el("input"); note.placeholder = "note (optional)";
          note.value = flags[key] || "";
          note.onclick = (e) => e.stopPropagation(); note.oninput = () => { flags[key] = note.value; upd(); };
          if (key in flags) d.classList.add("on");
          d.onclick = () => { if (key in flags) { delete flags[key]; d.classList.remove("on"); note.value = ""; } else { flags[key] = ""; d.classList.add("on"); } upd(); };
          d.append(im, lb, note); d.dataset.key = key; fr.appendChild(d);
        }
        cd.appendChild(fr); fd.appendChild(cd);
      }
    };
    fd.addEventListener("toggle", () => { if (fd.open) build(); });
    gd.appendChild(fd);
  }
  root.appendChild(gd);
}
const lines = () => Object.entries(flags).map(([k, note]) => { const [fig, clip, aim, fr] = k.split("|"); return fig + " · " + clip + (aim ? " " + aim : "") + " · " + fr + (note ? " — " + note : ""); });
const fb = document.getElementById("fallback");
document.getElementById("copy").onclick = () => {
  const t = lines().join("\n"); if (!t) return;
  const fail = () => { fb.style.display = "block"; fb.value = t; fb.focus(); fb.select(); };
  try { navigator.clipboard.writeText(t).then(() => { fb.style.display = "none"; const b = document.getElementById("copy"); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1200); }, fail); } catch (e) { fail(); }
};
document.getElementById("clear").onclick = () => { if (!Object.keys(flags).length || confirm("Clear all flags?")) { flags = {}; upd(); document.querySelectorAll(".fr.on").forEach((d) => { d.classList.remove("on"); d.querySelector("input").value = ""; }); fb.style.display = "none"; } };
document.getElementById("q").oninput = (e) => {
  const s = e.target.value.trim().toLowerCase();
  document.querySelectorAll("details.fig").forEach((d) => { const hit = !s || d.dataset.s.includes(s); d.style.display = hit ? "" : "none"; if (s && hit) { d.open = true; } });
  document.querySelectorAll("#root > details").forEach((g) => { if (s) g.open = true; });
};
upd();
</script></body></html>
