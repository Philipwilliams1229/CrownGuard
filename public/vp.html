<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Screen test" />
<link rel="manifest" href="./vp.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Screen test</title>
<!-- iPad bottom-bar hunt (WebKit bug 301108: a home-screen app with a
     black-translucent status bar gets a web view one status bar short).
     Green = an ordinary (not fixed) block 100lvh tall, red stripe on its
     bottom; orange = a fixed stripe at bottom: 0; blue = a fixed stripe at
     the top. Whichever stripe touches the bottom of the glass reaches it. -->
<style>
  html, body { margin: 0; background: #f0f; overscroll-behavior: none; }
  body { min-height: 100lvh; }
  #flow { position: relative; height: 100lvh; background: #2a6f3a; }
  #flowbot { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #e22; }
  .fix { position: fixed; }
  #bot { left: 0; width: 50%; bottom: 0; height: 8px; background: #f90; }
  #top { left: 0; right: 0; top: 0; height: 14px; background: #28e; }
  #lv { position: fixed; top: 0; height: 100lvh; width: 0; }
  #pr { position: fixed; left: 0; top: 0; width: 0; height: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; }
  #tap { position: fixed; width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 3px solid #ff0; border-radius: 50%; pointer-events: none; display: none; }
  pre { position: fixed; left: 20px; top: 60px; margin: 0; padding: 12px 16px; background: rgba(0,0,0,.75); color: #fff; font: 17px/1.4 ui-monospace, Menlo, monospace; border-radius: 8px; }
</style>
</head>
<body>
<div id="flow"><div id="flowbot"></div></div>
<div id="top" class="fix"></div><div id="bot" class="fix"></div><div id="lv"></div>
<div id="pr"></div>
<pre id="out"></pre>
<div id="tap"></div>
<script>
let lastTap = "-";
addEventListener("pointerdown", (e) => {
  const t = document.getElementById("tap");
  t.style.left = e.clientX + "px"; t.style.top = e.clientY + "px"; t.style.display = "block";
  lastTap = Math.round(e.clientX) + ", " + Math.round(e.clientY); show();
});
function show() {
  const cs = getComputedStyle(document.getElementById("pr"));
  const sa = [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].map(parseFloat).join(" / ");
  const fb = document.getElementById("flowbot").getBoundingClientRect();
  document.getElementById("out").textContent = [
    "TEST A: see-through status bar (as the game)",
    "status bar style          : black-translucent",
    "innerWidth x innerHeight  : " + innerWidth + " x " + innerHeight,
    "screen w x h              : " + screen.width + " x " + screen.height,
    "100lvh                    : " + Math.round(document.getElementById("lv").getBoundingClientRect().height),
    "page height / scrollY     : " + document.documentElement.scrollHeight + " / " + Math.round(scrollY),
    "red stripe bottom at      : " + Math.round(fb.bottom),
    "safe area t/r/b/l         : " + sa,
    "standalone                : " + (navigator.standalone === true),
    "visualViewport offsetTop  : " + (window.visualViewport ? Math.round(visualViewport.offsetTop) : "-"),
    "body rect top             : " + Math.round(document.body.getBoundingClientRect().top),
    "last tap at (clientX, Y)  : " + lastTap,
    "",
    "RED stripe = ordinary block, 100lvh tall",
    "ORANGE stripe (left half) = fixed, bottom 0",
    "Which one touches the bottom of the glass?",
    "TAP anywhere: the yellow ring should sit under your finger.",
    "(Turn to portrait and back, then tap again.)",
  ].join("\n");
}
show(); addEventListener("resize", show); addEventListener("scroll", show); setInterval(show, 1000);
</script>
</body>
</html>
