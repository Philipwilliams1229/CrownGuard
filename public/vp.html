<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Screen test" />
<link rel="manifest" href="./vp.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Screen test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f0f; }
  .fix { position: fixed; left: 0; right: 0; }
  #all { top: 0; bottom: 0; background: #2a6f3a; }
  #bot { bottom: 0; height: 14px; background: #e22; }
  #top { top: 0; height: 14px; background: #28e; }
  #lv { top: 0; height: 100lvh; border-bottom: 6px solid #ff0; box-sizing: border-box; }
  #dv { top: 0; height: 100dvh; border-bottom: 6px solid #0ff; box-sizing: border-box; }
  #sv { top: 0; height: 100svh; border-bottom: 6px solid #f0f; box-sizing: border-box; }
  #pr { position: fixed; left: 0; top: 0; width: 0; height: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; }
  pre { position: fixed; left: 20px; top: 60px; margin: 0; padding: 12px 16px; background: rgba(0,0,0,.75); color: #fff; font: 18px/1.4 ui-monospace, Menlo, monospace; border-radius: 8px; }
</style>
</head>
<body>
<div id="all" class="fix"></div>
<div id="lv" class="fix"></div><div id="dv" class="fix"></div><div id="sv" class="fix"></div>
<div id="top" class="fix"></div><div id="bot" class="fix"></div>
<div id="pr"></div>
<pre id="out"></pre>
<script>
function show() {
  const vv = window.visualViewport, cs = getComputedStyle(document.getElementById("pr"));
  const h = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
  const sa = [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].map(parseFloat).join(" / ");
  document.getElementById("out").textContent = [
    "innerWidth x innerHeight : " + innerWidth + " x " + innerHeight,
    "visualViewport w x h      : " + Math.round(vv.width) + " x " + Math.round(vv.height) + "  (offsetTop " + vv.offsetTop + ")",
    "screen w x h              : " + screen.width + " x " + screen.height,
    "100lvh / 100dvh / 100svh  : " + h("lv") + " / " + h("dv") + " / " + h("sv"),
    "fixed box top 0 bottom 0  : " + h("all"),
    "safe area t/r/b/l         : " + sa,
    "standalone                : " + (navigator.standalone === true) + " / " + matchMedia("(display-mode: fullscreen)").matches + " (fullscreen) / " + matchMedia("(display-mode: standalone)").matches + " (standalone)",
    "pixel ratio               : " + devicePixelRatio,
    "",
    "red strip = bottom edge of the page, blue = top edge.",
  ].join("\n");
}
show(); addEventListener("resize", show); addEventListener("orientationchange", () => setTimeout(show, 300)); setInterval(show, 1000);
</script>
</body>
</html>
