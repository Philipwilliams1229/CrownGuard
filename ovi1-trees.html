<html><head><meta charset="utf-8" /><title>ovi1 trees</title>
<style>body{background:#20242c;color:#e8e0c8;font-family:monospace;padding:12px}canvas{width:840px;image-rendering:pixelated}</style></head>
<body><div id="status">running…</div>
<script type="module">
  import { setDay } from "/src/data/sun.js";
  import { SWAY, IRON, standRing, bracken, heather, larchLitter, IREACH, h2, rng } from "/concept/ovi1-trees.js";
  import { selectRealm } from "/src/data/maps.js";
  import { selectFaction } from "/src/data/factions.js";
  import { setWaveWindow } from "/src/data/waves.js";
  import { updateGame } from "/src/engine/update.js";
  import { placeTower, upgradeTower, buildableAt, startWave } from "/src/engine/actions.js";
  import { draw } from "/src/render/draw.js";
  import { setLevelWeather } from "/src/engine/weather.js";
  import { DECOR, forestDepthAt, inRiver, inSea } from "/src/data/terrain.js";
  import { nearestOnPath } from "/src/engine/path.js";
  import { PATH_HALF } from "/src/data/constants.js";
  import { layShadows } from "/concept/overhaul-trees.js";
  const q = new URLSearchParams(location.search), MODE = q.get("mode") || "sheet";
  setDay(q.get("sun") || "late");
  const save = async (name, cv) => { await fetch(`/__shot?name=${name}`, { method: "POST", body: cv.toDataURL("image/png").slice(22) }); document.title = "DONE"; document.getElementById("status").textContent = "saved " + name; };
  if (MODE === "sheet") {
    const items = [["scots", 0.9, 0], ["scots", 0.9, 1, { lean: 14 }], ["spruce", 1, 0], ["spruce", 1, 1], ["spruce", 1, 0, { lean: 10, flag: 1 }], ["thorn", 1, 0], ["thorn", 1, 1, { lean: 20, leafy: 0.2 }], ["larch", 1, 0], ["larch", 1, 0, { lean: 6 }]];
    const Z = 3, CW = 170, CH = 190, COLS = 5, rows = Math.ceil(items.length / COLS);
    const out = document.createElement("canvas"); out.width = COLS * CW * Z; out.height = rows * CH * Z; const oc = out.getContext("2d"); oc.imageSmoothingEnabled = false;
    items.forEach(([sp, k, dk, o], i) => {
      const cell = document.createElement("canvas"); cell.width = CW; cell.height = CH; const cc = cell.getContext("2d");
      cc.fillStyle = "#7a7a3e"; cc.fillRect(0, 0, CW, CH);
      for (let n = 0; n < 500; n++) { cc.fillStyle = ["#6e6e38", "#868646", "#74743c"][n % 3]; cc.fillRect(((n * 7919) % CW), ((n * 104729) % CH), 2, 1); }
      standRing(cc, CW / 2, CH - 14, 30, 5 + i, true);
      bracken(cc, CW / 2 + 40, CH - 12, 14, 3 + i); heather(cc, CW / 2 - 44, CH - 10, 16, 7 + i);
      const s = IRON[sp](k, dk, 3 + i * 5, o || {});
      cc.drawImage(s.cv, CW / 2 - s.ax, CH - 14 - s.ay);
      const X = (i % COLS) * CW * Z, Y = Math.floor(i / COLS) * CH * Z;
      oc.drawImage(cell, X, Y, CW * Z, CH * Z);
      oc.fillStyle = "#20242c"; oc.fillRect(X, Y + CH * Z - CH - 4, CW + 4, CH + 4); oc.drawImage(cell, X, Y + CH * Z - CH);
      oc.fillStyle = "rgba(32,36,44,0.85)"; oc.fillRect(X + 4, Y + 4, 330, 22); oc.fillStyle = "#f4ecd8"; oc.font = "16px monospace"; oc.fillText(`${sp} dk${dk} ${o ? JSON.stringify(o) : ""}`, X + 8, Y + 20);
    });
    document.body.appendChild(out);
    await save("ovi1_tmp_trees_sheet", out);
  }

  const ANIMS = { wind_B: ["B", [0, 140, 260, 170], 1.3], wind_C: ["C", [0, 80, 260, 170], 2], needles_B: ["B", [60, 270, 260, 170], 1.3] };
  const AN = MODE === "anim" ? ANIMS[q.get("name")] : null;
  if (MODE === "scene" || AN) {
    const SC = { 1: { realm: "wardenmoor", halls: [["archer", 285, 320, 3], ["knight", 499, 259, 2]] }, 2: { realm: "kestrel", halls: [["archer", 285, 335, 3], ["knight", 470, 250, 2]] } }[q.get("scene") || "1"];
    const OPT = AN ? AN[0] : q.get("opt") || "today", TAG = q.get("tag") || "", SUN = q.get("sun") || "late";
    selectRealm(SC.realm); selectFaction("iron"); setWaveWindow(null); setLevelWeather(null);
    const removed = [], GONE = new Set(["irspruce", "irpine", "irheather"]);
    if (OPT !== "today") for (let i = DECOR.length - 1; i >= 0; i--) if (GONE.has(DECOR[i].t)) removed.push(DECOR.splice(i, 1)[0]);
    const g = { run: { kills: 0, goldEarned: 0, towersBuilt: 0, leaks: 0 }, gold: 1e7, lives: 9999, wave: 5, phase: "build", towers: [], enemies: [], projectiles: [], effects: [], spawnQueue: [], spawnTimer: 0, speed: 1, paused: false,
      selectedId: null, buildMode: null, hover: null, time: 0, shake: 0, snapshot: null, grounds: [], cam: { zoom: 1, x: 0, y: 0 }, buildUntil: null, buildMenuOpen: false, victory: false, rush: false, bands: [], militiaCd: 0, freeplay: true };
    const halls = [];
    for (const [kd, x0, y0, lv] of SC.halls) {
      let spot = null;
      for (let r = 0; r < 80 && !spot; r += 3) for (let a = 0; a < 6.28 && !spot; a += 0.5) { const x = x0 + Math.cos(a) * r, y = y0 + Math.sin(a) * r; if (buildableAt(g, x, y, kd)) spot = [x, y]; }
      if (!spot) continue;
      placeTower(g, kd, spot[0], spot[1]); const t = g.towers[g.towers.length - 1]; for (let l = 1; l < lv; l++) upgradeTower(g, t); t.readyAt = 0; t.raised = null; halls.push(spot);
    }
    for (let i = 0; i < 30; i++) updateGame(g, 1 / 60);
    const cv = document.createElement("canvas"); cv.width = 1680; cv.height = 1120;
    const T0 = performance.now(), D0 = Date.now(); performance.now = () => T0; Date.now = () => D0;
    draw(g, cv, { current: null }); draw(g, cv, { current: null });
    const ctx = cv.getContext("2d"); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const W = 1680, H = 1120, others = DECOR.filter((d) => !d.forest);
    const okSpot = (x, y, rad = 30) => nearestOnPath(x, y).d >= PATH_HALF + rad && halls.every(([hx, hy]) => Math.hypot(hx - x, hy - y) > 40) && !inRiver(x, y, 6) && !inSea(x, y) && x > 4 && x < 690 && y > 14 && y < 548
      && others.every((d) => Math.hypot(d.x - x, d.y - y) > 26 || d.t === "irheather");
    if (OPT !== "today") {
      // ---- late autumn on the turf: green pixels become olive-straw; halls and figures keep their colours ----
      const img = ctx.getImageData(0, 0, W, H), d = img.data, orig = new Uint8ClampedArray(d), act = new Uint8Array(W * H);
      const box = (x, y, hw, up, dn) => { for (let j = Math.max(0, Math.round(y * 2 - up)); j < Math.min(H, Math.round(y * 2 + dn)); j++) for (let i = Math.max(0, Math.round(x * 2 - hw)); i < Math.min(W, Math.round(x * 2 + hw)); i++) act[j * W + i] = 1; };
            for (let k = 0; k < W * H; k++) {
        if (act[k]) continue;
        const r = d[k * 4], gg = d[k * 4 + 1], b = d[k * 4 + 2];
        if (r > gg * 1.12 && b > gg * 1.08) { // the ground's own heather: duller, browner, a step darker (late autumn)
          d[k * 4] = r * 0.66 + 14; d[k * 4 + 1] = gg * 0.66 + 14; d[k * 4 + 2] = b * 0.7 + 10; continue;
        }
        if (!(gg > r * 0.97 && gg > b * 1.12)) continue;
        const l = 0.3 * r + 0.59 * gg + 0.11 * b, tt = Math.max(0, Math.min(1, (l - 55) / 110));
        const o = [58 + 96 * tt, 62 + 80 * tt, 38 + 42 * tt];
        d[k * 4] = o[0] * 0.88 + r * 0.12; d[k * 4 + 1] = o[1] * 0.88 + gg * 0.12; d[k * 4 + 2] = o[2] * 0.88 + b * 0.12;
      }
      ctx.putImageData(img, 0, 0);
      // ---- the layout ----
      const items = [], cache = new Map(), sprite = (sp, k, dk, slot, o = {}) => { const key = `${sp}|${k}|${dk}|${slot}|${JSON.stringify(o)}`; let v = cache.get(key); if (!v) cache.set(key, (v = IRON[sp](k, dk, 3 + slot * 11 + (sp.length * 7), o))); return v; };
      const put = (sp, x, y, k, dk, slot, o = {}) => { k = Math.round(k * 1.25 * 20) / 20; const spr = sprite(sp, k, dk, slot, o); items.push({ spr, x, y, sp, k, dk, slot, o }); };
      const wind = OPT === "C" ? 1 : 0;
      for (const dd of removed) if (dd.forest) {
        const dep = forestDepthAt(dd.x, dd.y), dk = dep > 46 ? 2 : dep > 16 ? 1 : 0, h = h2(dd.x | 0, dd.y | 0, 41), r = h2(dd.x | 0, dd.y | 0, 43), slot = Math.floor(h2(dd.x | 0, dd.y | 0, 47) * 3);
        const keep = { A: [0.6, 0.45, 0.34], B: [0.66, 0.46, 0.34], C: [0.6, 0.48, 0.38] }[OPT][dk];
        if (h > keep) continue;
        const x = dd.x, y = dd.y + 10;
        if (OPT === "A") { if (dk === 0) put(r < 0.45 ? "scots" : r < 0.85 ? "spruce" : "thorn", x, y, r < 0.45 ? 0.85 + slot * 0.06 : r < 0.85 ? 1 : 0.9, 0, slot, r > 0.85 ? { lean: 10 } : {}); else if (dk === 1) put(r < 0.7 ? "spruce" : "scots", x, y, r < 0.7 ? 0.9 : 0.8, 1, slot); else put("spruce", x, y, 0.8, 2, slot); }
        if (OPT === "B") { if (dk === 0) put(r < 0.45 ? "larch" : r < 0.7 ? "thorn" : "spruce", x, y, r < 0.45 ? 1 : 0.9, 0, slot, r >= 0.45 && r < 0.7 ? { lean: 6 } : {}); else if (dk === 1) put(r < 0.6 ? "spruce" : "larch", x, y, r < 0.6 ? 0.9 : 0.85, 1, slot); else put(r < 0.15 ? "larch" : "spruce", x, y, 0.8, 2, slot); }
        if (OPT === "C") { if (dk === 0) put(r < 0.4 ? "scots" : r < 0.8 ? "thorn" : "spruce", x, y, r < 0.4 ? 0.9 : r < 0.8 ? 1 : 0.85, 0, slot, r < 0.4 ? { lean: 34, tall: 0.88 } : r < 0.8 ? { lean: 44 } : { lean: 18, flag: 1 }); else if (dk === 1) put("spruce", x, y, 0.85, 1, slot, { lean: 16, flag: 1 }); else put("spruce", x, y, 0.75, 2, slot, { lean: 10, flag: 1 }); }
      }
      // the moor: lone trees, groves, a shelter belt (each option its own idea)
      const R = rng(77 + (q.get("scene") | 0)), taken = [];
      const spot = (sep, rad) => { for (let n = 0; n < 500; n++) { const x = 120 + R() * 570, y = 30 + R() * 510; if (okSpot(x, y, rad) && taken.every(([a, b]) => Math.hypot(a - x, b - y) > sep)) { taken.push([x, y]); return [x, y]; } } return null; };
      if (OPT === "A") for (let i = 0; i < 9; i++) { const p = spot(80, 34); if (!p) break; const sp = i % 3 === 0 ? "scots" : i % 3 === 1 ? "spruce" : "thorn"; put(sp, p[0], p[1], sp === "scots" ? 0.9 : sp === "thorn" ? 0.95 : 0.95, 0, i % 3, sp === "thorn" ? { lean: 14 } : {}); if (i % 3 === 1) for (let j = 0; j < 2; j++) { const x = p[0] + (j ? 20 : -17), y = p[1] + (j ? 8 : 12); if (okSpot(x, y, 12)) put("spruce", x, y, 0.8, 0, j + 1); } }
      if (OPT === "B") { for (let i = 0; i < 3; i++) { const p = spot(110, 46); if (!p) break; const n = 5 + (i % 2); for (let j = 0; j < n; j++) { const a = j * 2.4 + i, dr = 8 + (j % 3) * 9, x = p[0] + Math.cos(a) * dr * 1.4, y = p[1] + Math.sin(a) * dr; if (okSpot(x, y, 14)) put("larch", x, y, 0.85 + (j % 3) * 0.1, 0, j % 3, { lean: (j % 2) * 3 }); } } for (let i = 0; i < 4; i++) { const p = spot(70, 30); if (p) put(i % 2 ? "thorn" : "spruce", p[0], p[1], 0.95, 0, i, i % 2 ? { lean: 8 } : {}); } }
      if (OPT === "C") { const p0 = q.get("scene") === "2" ? [150, 505] : [175, 46]; for (let j = 0; j < 9; j++) { const x = p0[0] + j * 15, y = p0[1] + (j % 2) * 5; if (okSpot(x, y, 10)) put("spruce", x, y, 0.62, 0, j % 3, { lean: 14, flag: 1, tall: 0.7, wide: 1.25 }); } for (let i = 0; i < 6; i++) { const q2 = spot(80, 30); if (!q2) break; put(i % 3 === 0 ? "scots" : "thorn", q2[0], q2[1], i % 3 === 0 ? 0.9 : 1, 0, i % 3, i % 3 === 0 ? { lean: 34, tall: 0.88 } : { lean: 44 }); } }
      // ---- ground cover (before the trees): bracken and heather where the heather clumps were, and under the trees ----
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      let sd = 5;
      for (const dd of removed) if (dd.t === "irheather" && okSpot(dd.x, dd.y, 6)) {
        const x = dd.x * 2, y = dd.y * 2, rx = 22 * (dd.s || 1);
        if (OPT === "A") { heather(ctx, x, y, rx, ++sd, 1); if (h2(sd, 1, 1) < 0.6) bracken(ctx, x + 14, y + 4, 12, sd, 0, 1); }
        if (OPT === "B") { if (h2(sd++, 2, 3) < 0.65) bracken(ctx, x, y, rx * 0.9, sd, 0, 1.3); else heather(ctx, x, y, rx * 0.8, sd, 0.8); }
        if (OPT === "C") { heather(ctx, x, y, rx * 1.1, ++sd, 0.7); bracken(ctx, x + 10, y + 6, 12, sd, 1.4, 0.8); }
      }
      for (const it of items) {
        const px = Math.round(it.x * 2), py = Math.round(it.y * 2), rx = Math.round(IREACH[it.sp][1] * it.k * 1.9);
        if (forestDepthAt(it.x, it.y) > -6 && it.sp !== "larch") { if (h2(px, py, 5) < 0.5) standRing(ctx, px, py, Math.round(rx * 0.8), px * 3 + py, true); }
        else standRing(ctx, px, py, rx, px * 3 + py, true);
        if (it.sp === "larch") larchLitter(ctx, px, py, Math.round(rx * 1.3), px + py);
        if (OPT === "B" && it.sp !== "spruce" && h2(px, py, 8) < 0.5) bracken(ctx, px + 18, py + 4, 11, px + py, 0, 0.9);
        if (OPT !== "B" && it.sp !== "larch" && h2(px, py, 9) < 0.4) bracken(ctx, px + 24, py + 6, 12, px + py + 3, OPT === "C" ? 1.4 : 0, 1);
      }
      ctx.restore();
      layShadows(ctx, items.map((it) => ({ sp: it.spr, px: Math.round(it.x * 2), py: Math.round(it.y * 2) })), W, H, 0.12);
      items.sort((a, b) => a.y - b.y);
      if (AN) {
        const [, [cx, cy, cw, ch], strength] = AN, F = 20, COLS = 5, ROWS = 4, FW = cw * 2, FH = ch * 2, NAME = q.get("name");
        const bg = document.createElement("canvas"); bg.width = W; bg.height = H; bg.getContext("2d").drawImage(cv, 0, 0);
        const live = items.filter((it) => it.x * 2 > cx * 2 - 60 && it.x * 2 < (cx + cw) * 2 + 60 && it.y * 2 > cy * 2 && it.y * 2 < (cy + ch) * 2 + 160);
        const AMP = { scots: 5, thorn: 4, spruce: 4, larch: 5 }, poses = new Map();
        const pose = (it, a) => { const key = `${it.sp}|${it.k}|${it.dk}|${it.slot}|${JSON.stringify(it.o)}|${a}`; let v = poses.get(key); if (!v) { SWAY.at = () => a; try { v = IRON[it.sp](it.k, it.dk, 3 + it.slot * 11 + it.sp.length * 7, { ...it.o, sway: a }); } finally { SWAY.at = null; } poses.set(key, v); } return v; };
        const needles = [];
        if (NAME === "needles_B") for (const it of live) if (it.sp === "larch") for (let n = 0; n < 16; n++) { const r = h2(it.x | 0, n, 71), r2 = h2(it.x | 0, n, 72), r3 = h2(it.y | 0, n, 73); needles.push({ x0: it.x * 2 + (r - 0.5) * 36, y0: it.y * 2 - (50 + r2 * 90), gy: it.y * 2 + (r3 - 0.3) * 18, ph: (n / 16 + r3 * 0.1) % 1, dx: 38 + r2 * 20, c: ["#e8bc44", "#d8a63a", "#f0cc60"][n % 3] }); }
        const out = document.createElement("canvas"); out.width = FW * COLS; out.height = FH * ROWS; const oc = out.getContext("2d");
        const fr = document.createElement("canvas"); fr.width = FW; fr.height = FH; const fc = fr.getContext("2d"); fc.imageSmoothingEnabled = false;
        const frames = [];
        for (let f = 0; f < F; f++) {
          fc.drawImage(bg, cx * 2, cy * 2, FW, FH, 0, 0, FW, FH);
          for (const it of live) {
            const ph = h2(it.x | 0, it.y | 0, 61) * 0.22, w = Math.sin(2 * Math.PI * (f / F + ph)), gust = 0.62 + 0.38 * Math.sin(2 * Math.PI * (2 * f / F + ph * 2));
            const a = Math.round(AMP[it.sp] * strength * (w * gust * 0.8 + (OPT === "C" ? 0.6 : 0.15)));
            const sp = pose(it, a);
            fc.drawImage(sp.cv, Math.round(it.x * 2 - sp.ax - cx * 2), Math.round(it.y * 2 - sp.ay - cy * 2));
          }
          for (const n of needles) { const t = (f / F + n.ph) % 1; if (t < 0.06 || t > 0.9) continue; const x = n.x0 + t * n.dx + Math.round(Math.sin(2 * Math.PI * (t * 3 + n.ph)) * 2), y = n.y0 + (n.gy - n.y0) * t; fc.fillStyle = "rgba(30,20,10,0.45)"; fc.fillRect(Math.round(x - cx * 2) + 1, Math.round(y - cy * 2) + 2, 3, 2); fc.fillStyle = n.c; fc.fillRect(Math.round(x - cx * 2), Math.round(y - cy * 2), 3, 2); }
          oc.drawImage(fr, (f % COLS) * FW, Math.floor(f / COLS) * FH);
          if (f === 0) await save(`ovi1_anim_trees_${NAME}_still`, fr);
          frames.push(fc.getImageData(0, 0, FW, FH).data.slice());
        }
        // loop check: step 0->1 against step F-1->0, and shimmer (pixels equal in frames 0,2 but different in 1) as counts
        const df = (a, b) => { let n = 0; for (let k = 0; k < a.length; k += 4) if (a[k] !== b[k] || a[k + 1] !== b[k + 1] || a[k + 2] !== b[k + 2]) n++; return n; };
        const qtr = [0, 5, 10, 15].map((i) => df(frames[0], frames[i]));
        document.body.appendChild(out);
        await save(`ovi1_anim_trees_${NAME}_c${COLS}r${ROWS}_fps10`, out);
        document.getElementById("status").textContent = `loop ${NAME}: step 0->1 ${df(frames[0], frames[1])} px, ${F - 1}->0 ${df(frames[F - 1], frames[0])} px; vs frame0 at 5/10/15: ${qtr.slice(1)}; poses ${poses.size}; needles ${needles.length}`;
        throw new Error("done");
      }
      for (const it of items) ctx.drawImage(it.spr.cv, Math.round(it.x * 2 - it.spr.ax), Math.round(it.y * 2 - it.spr.ay));
      document.getElementById("status").textContent = `trees ${items.length}  sprites ${cache.size}  halls ${halls.length}`;
    }
    document.body.appendChild(cv);
    await save(`ovi1_trees_${["", "wardenmoor", "kestrel"][q.get("scene") || 1]}_${OPT}${TAG}`, cv);
  }
</script></body></html>
