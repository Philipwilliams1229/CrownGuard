<!doctype html>
<!--
  Identity lab for the overhaul seams (art/briefs/overhaul-build-millrace.md, section 5): the REAL engine
  and draw() on each realm x sun with Math.random seeded and the game clock frozen, and a hash of the
  board's pixels (and of the apron painted round it) per case. Run it before and after a change to a
  shared file: every hash must match.

    /ovh-identity.html?tag=base
      realms=millrace,thornbrook,gullwick,ironford,frostwake,bellmarsh   (default)
      suns=noon,morning,golden                                            (default)
      secs=6      seconds of combat before the frozen frame
      apron=0     skip the apron (the land beyond the board)
  Faction is the realm's own chapter (greenwood / iron / rime / hollow) by realm id; &faction= forces one.
  Results: shown in the page, window.__ovhIdentity, and saved to .shots/ovh_identity_<tag>.json.png
  (the dev server's /__shot sink always appends .png: the file is the JSON TEXT, not an image).
  document.title = DONE when finished.
-->
<html>
  <head><meta charset="utf-8" /><title>ovh identity</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; white-space: pre; }</style></head>
  <body>
    <div id="status">running…</div>
    <script type="module">
      import { selectRealm, REALMS } from "/src/data/maps.js";
      import { selectFaction } from "/src/data/factions.js";
      import { setWaveWindow } from "/src/data/waves.js";
      import { TOTAL_LEN, posAt, angleAt } from "/src/engine/path.js";
      import { updateGame } from "/src/engine/update.js";
      import { placeTower, upgradeTower, buildableAt, startWave } from "/src/engine/actions.js";
      import { draw } from "/src/render/draw.js";
      import { paintApron } from "/src/render/apron.js";
      import { setLevelWeather } from "/src/engine/weather.js";
      import { setDay } from "/src/data/sun.js";
      const q = new URLSearchParams(location.search);
      const TAG = q.get("tag") || "x", DT = 1 / 60, SECS = Number(q.get("secs") || 6);
      const realms = (q.get("realms") || "millrace,thornbrook,gullwick,ironford,frostwake,bellmarsh").split(",");
      const suns = (q.get("suns") || "noon,morning,golden").split(",");
      const factionOf = (id) => q.get("faction") || (/^ir|iron|brine|warden|black|crow|under|citadel|kestrel/.test(id) ? "iron"
        : /frost|rime|whale|skald|kraken|jarl/.test(id) ? "rime" : /bell|hl|grave|salt|lantern|abbey|barrow|dead|lich|wight|reed|caus|drown|still|throne|cairn/.test(id) ? "hollow" : "greenwood");
      const seedRandom = (s) => { let a = s >>> 0; Math.random = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
      const hashCanvas = (cv) => {
        const d = new Uint32Array(cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data.buffer);
        let h = 0x811c9dc5;
        for (let i = 0; i < d.length; i++) h = Math.imul(h ^ d[i], 0x01000193);
        return (h >>> 0).toString(16).padStart(8, "0");
      };
      const out = {};
      const lines = [];
      for (const realm of realms) for (const sun of suns) {
        const key = `${realm}|${sun}`;
        try {
          seedRandom(0xC0FFEE);
          setDay(sun);
          if (!REALMS[realm]) throw new Error("no realm " + realm);
          selectRealm(realm);
          selectFaction(factionOf(realm));
          setWaveWindow(null);
          setLevelWeather(null);
          const g = {
            run: { kills: 0, goldEarned: 0, towersBuilt: 0, leaks: 0 }, gold: 1e7, lives: 9999, wave: 5, phase: "build",
            towers: [], enemies: [], projectiles: [], effects: [], spawnQueue: [], spawnTimer: 0, speed: 1, paused: false,
            selectedId: null, buildMode: null, hover: null, time: 0, shake: 0, snapshot: null, grounds: [],
            cam: { zoom: 1, x: 0, y: 0 }, buildUntil: null, buildMenuOpen: false, victory: false, rush: false, bands: [], militiaCd: 0,
          };
          for (const [kd, at, lv] of [["archer", 0.3, 3], ["knight", 0.45, 2], ["wizard", 0.6, 2], ["riverwatch", 0.5, 1]]) {
            const d0 = at * TOTAL_LEN, [rx, ry] = posAt(d0), a = angleAt(d0);
            let spot = null;
            for (let r = 30; r < 200 && !spot; r += 3) for (const s of [1, -1]) {
              const x = rx + Math.cos(a + Math.PI / 2) * r * s, y = ry + Math.sin(a + Math.PI / 2) * r * s;
              if (buildableAt(g, x, y, kd)) { spot = [x, y]; break; }
            }
            if (!spot) continue;
            placeTower(g, kd, spot[0], spot[1]);
            const t = g.towers[g.towers.length - 1];
            for (let l = 1; l < lv; l++) upgradeTower(g, t);
            t.readyAt = 0; t.raised = null;
          }
          for (let i = 0; i < 30; i++) updateGame(g, DT);
          startWave(g);
          for (let el = 0; el < SECS; el += DT) { updateGame(g, DT); g.lives = 9999; if (g.phase !== "combat") startWave(g); }
          g.shake = 0;
          let apronHash = "-";
          if (q.get("apron") !== "0") {
            const ap = document.createElement("canvas");
            paintApron(ap, { cssW: 1180, cssH: 1000, dpr: 1, board: { x: 40, y: 133, w: 1100, h: 733 } });
            apronHash = hashCanvas(ap);
          }
          const cv = document.createElement("canvas"); cv.width = 1680; cv.height = 1120;
          draw(g, cv, { current: null }); draw(g, cv, { current: null });
          out[key] = { board: hashCanvas(cv), apron: apronHash, foes: g.enemies.length, towers: g.towers.length };
        } catch (err) { out[key] = { error: String(err && err.stack || err) }; }
        lines.push(`${key.padEnd(24)} ${JSON.stringify(out[key])}`);
        document.getElementById("status").textContent = lines.join("\n");
      }
      window.__ovhIdentity = out;
      await fetch(`/__shot?name=ovh_identity_${TAG}.json`, { method: "POST", body: btoa(JSON.stringify(out, null, 1)) });
      document.getElementById("status").textContent = lines.join("\n") + `\n\nsaved .shots/ovh_identity_${TAG}.json.png (JSON text)`;
      document.title = "DONE";
    </script>
  </body>
</html>
