<!doctype html>
<!--
  Tower artist A's lab: the four starting halls through a firing cycle,
  painted once at load and saved to .shots/twa_<kind>_<tag>.png.
    /twa-lab.html?kinds=archer,wizard&tag=v1&scale=1&forms=0,3,4&rows=idle,fire
  Rows: idle (a habit moment), busy mid-cooldown, cocked (about to loose),
  release, follow-through. `t=` shifts the clock (idle habits cycle).
-->
<html>
  <head><meta charset="utf-8" /><title>twa lab</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; }</style></head>
  <body>
    <div id="status">painting…</div>
    <script type="module">
      import { selectRealm } from "/src/data/maps.js";
      import * as T from "/src/render/towers.js";
      import { groundLayer } from "/src/render/world.js";
      import { getStats } from "/src/engine/towers.js";
      const q = new URLSearchParams(location.search);
      const KINDS = (q.get("kinds") || "archer").split(","), TAG = q.get("tag") || "x", SC = Number(q.get("scale")) || 1;
      const T0 = Number(q.get("t")) || 3.2;
      selectRealm(q.get("realm") || "greenwood");
      const P = { archer: T.drawArcherTower, knight: T.drawGarrison, wizard: T.drawWizardSpire, support: T.drawSupportTower };
      const ALL = [
        { level: 1 }, { level: 2 }, { level: 3 },
        { level: 3, branch: "a" }, { level: 3, branch: "a", rank4: "a" }, { level: 3, branch: "a", rank4: "b" },
        { level: 3, branch: "b" }, { level: 3, branch: "b", rank4: "a" }, { level: 3, branch: "b", rank4: "b" },
      ];
      const forms = q.get("forms") ? q.get("forms").split(",").map((i) => ALL[+i]) : ALL;
      const ROWS = {
        idle: { idle: true, anim: 0, cdf: 0 }, mid: { anim: 0, cdf: 0.5 }, cocked: { anim: 0, cdf: 0.04 },
        fire: { anim: 0.95, cdf: 1 }, follow: { anim: 0.45, cdf: 0.9 }, live: { anim: 0, cdf: 0.5, aura: 4 },
      };
      const rows = (q.get("rows") || "idle,mid,cocked,fire,follow").split(",");
      const CW = Number(q.get("cw")) || 110, CH = Number(q.get("ch")) || 140, R = 2;
      const ground = groundLayer();
      // ?board=<name>: the four halls standing on the real greenwood board,
      // drawn by the real draw(), full frame and a 2x crop (idle=1 rests them)
      const BOARD = q.get("board");
      if (BOARD) {
        const { draw } = await import("/src/render/draw.js");
        const { posAt, angleAt, TOTAL_LEN } = await import("/src/engine/path.js");
        const { ENEMIES } = await import("/src/data/enemies.js");
        const { W, H } = await import("/src/data/constants.js");
        const idle = q.get("idle") === "1";
        const Tw = (id, kind, x, y, level, branch = null, rank4 = null) => ({ id, kind, x, y, level, branch, rank4, cd: 300, aim: "first", lastAim: 0.4 + id, anim: id % 3 === 0 ? 0.9 : 0, shotIdx: 0, critIdx: 0, invested: 0, units: [], rally: null, kills: 0, dmgOut: 0, liveTime: 1, _idle: idle, charges: 3, ramp: 2, mAnim: 0, eagle: null });
        const SETS = {
          1: [["archer", 1], ["archer", 3, "a", "b"], ["archer", 3, "b", "a"], ["wizard", 2], ["wizard", 3, "a", "a"], ["wizard", 3, "b", "b"],
              ["support", 1], ["support", 3, "a", "a"], ["support", 3, "b", "b"], ["knight", 2], ["knight", 3, "a"], ["knight", 3, "b", "a"]],
          2: [["archer", 3], ["archer", 3, "a", "a"], ["archer", 3, "b", "b"], ["wizard", 1], ["wizard", 3, "a", "b"], ["wizard", 3, "b", "a"],
              ["support", 3], ["support", 3, "a", "b"], ["support", 3, "b", "a"], ["knight", 1], ["knight", 3, "a", "a"], ["knight", 3, "b", "b"]],
          3: [["archer", 2], ["archer", 3, "a"], ["archer", 3, "b"], ["wizard", 3], ["wizard", 3, "a"], ["wizard", 3, "b"],
              ["support", 2], ["support", 3, "a"], ["support", 3, "b"], ["knight", 3], ["knight", 3, "b"], ["knight", 3, "b", "b"]],
        };
        const SLOTS = [[250, 180], [334, 180], [462, 180], [530, 180], [250, 250], [334, 250], [462, 250], [530, 250], [250, 316], [334, 316], [462, 316], [530, 316]];
        const set = SETS[q.get("set") || 1];
        const order = [0, 3, 6, 9, 1, 4, 7, 10, 2, 5, 8, 11];
        let towers = SLOTS.map(([x, y], i) => { const s = set[order[i]]; return Tw(i + 1, s[0], x, y, s[1], s[2] || null, s[3] || null); });
        if (q.get("tight")) {
          // every form at the tightest legal spots: 48..52 from the road's
          // centreline, as far apart as the board allows
          const { buildableAt } = await import("/src/engine/actions.js");
          const { nearestOnPath } = await import("/src/engine/path.js");
          const all = [...SETS[1], ...SETS[2], ...SETS[3]];
          const kinds = (q.get("kinds") || "archer,knight,wizard,support").split(",");
          const forms = all.filter((f) => kinds.includes(f[0]));
          const gg = { towers: [] };
          const spots = [];
          for (let yy = 30; yy < 540; yy += 3) for (let xx = 30; xx < 740; xx += 3) {
            const d = nearestOnPath(xx, yy).d;
            if (d < 48 || d > 52 || !buildableAt(gg, xx, yy)) continue;
            if (spots.some(([sx, sy]) => Math.hypot(sx - xx, sy - yy) < 60)) continue;
            spots.push([xx, yy]);
          }
          const off = Number(q.get("off")) || 0;
          towers = spots.map(([sx, sy], i) => { const f = forms[(i + off) % forms.length]; return Tw(i + 1, f[0], sx, sy, f[1], f[2] || null, f[3] || null); });
        }
        const mk = (type, frac, lane) => {
          const d = ENEMIES[type], dist = TOTAL_LEN * frac, [px, py] = posAt(dist), a = angleAt(dist);
          return { id: Math.floor(dist), type, hp: d.hp, maxHp: d.hp, dist, x: px + Math.cos(a + Math.PI / 2) * lane, y: py + Math.sin(a + Math.PI / 2) * lane,
            face: Math.cos(a) >= 0 ? 1 : -1, size: d.size, armor: d.armor, mres: 0, guard: 0, guardFlash: 0, flying: !!d.flying, boss: !!d.boss, atkAnim: 0,
            stunUntil: 0, slowUntil: 0, slowPct: 0, auraSlow: 0, burnUntil: 0, poisonUntil: 0, brittleUntil: 0, healedFlash: 0, hitFlash: 0, blockedBy: null, engaged: false, dead: false, revived: false };
        };
        const g = { time: 7.3, cam: { zoom: 1, x: 0, y: 0 }, shake: 0, lives: 20, wave: 5, towers, projectiles: [], effects: [], grounds: [], corpses: [], spawnQueue: [],
          enemies: idle ? [] : [mk("goblin", 0.3, 0), mk("orc", 0.35, 10), mk("goblin", 0.5, -12)], phase: "combat", buildMode: null, hover: null, selectedId: null, banner: null, paused: false, buildUntil: null };
        const bc = document.createElement("canvas"); bc.width = W; bc.height = H;
        draw(g, bc, { current: null });
        if (q.get("foot")) {
          const c3 = bc.getContext("2d"); c3.save(); c3.setTransform(bc.width / W, 0, 0, bc.width / W, 0, 0);
          c3.strokeStyle = "#ff00ff"; c3.lineWidth = 0.5;
          for (const t of towers) { c3.beginPath(); c3.ellipse(t.x, t.y + 3, 18, 13, 0, 0, 7); c3.stroke(); }
          c3.restore();
        }
        // draw() re-derives _idle from the enemies; fine: idle=1 has none
        await fetch("/__shot?name=twa_board_" + BOARD, { method: "POST", body: bc.toDataURL("image/png").slice(22) });
        const k = bc.width / W, [cx, cy, cw, ch] = [200, 100, 380, 250], sc = 2;
        const cc = document.createElement("canvas"); cc.width = cw * k * sc; cc.height = ch * k * sc;
        const c2 = cc.getContext("2d"); c2.imageSmoothingEnabled = false;
        c2.drawImage(bc, cx * k, cy * k, cw * k, ch * k, 0, 0, cc.width, cc.height);
        await fetch("/__shot?name=twa_board_" + BOARD + "_crop", { method: "POST", body: cc.toDataURL("image/png").slice(22) });
        document.title = "DONE";
        throw new Error("board done");
      }
      for (const KIND of KINDS) {
        const cv = document.createElement("canvas");
        cv.width = CW * R * forms.length; cv.height = CH * R * rows.length;
        const ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        forms.forEach((f, i) => rows.forEach((rn, ri) => {
          const row = ROWS[rn];
          ctx.save();
          ctx.setTransform(R, 0, 0, R, i * CW * R, ri * CH * R);
          ctx.drawImage(ground, 120 * 2, 200 * 2, CW * 2, CH * 2, 0, 0, CW, CH);
          const time = T0 + i * 0.37 + ri * 0.11;
          const t = {
            id: i + 3, kind: KIND, x: CW / 2, y: CH * 0.74, level: f.level, branch: f.branch || null, rank4: f.rank4 || null,
            cd: 0, aim: "first", lastAim: 0.3, anim: row.anim, shotIdx: 0, critIdx: 0, invested: 0, units: [],
            rally: null, kills: 0, dmgOut: 0, liveTime: 1, _idle: !!row.idle, _auraLive: row.aura || 0,
            charges: 3, ramp: 2, mAnim: row.anim, eagle: null,
          };
          const st = getStats(t);
          t.cd = (st.rate || 1000) * row.cdf;
          try { P[KIND](ctx, t, time); } catch (e) { console.error(e); ctx.fillStyle = "red"; ctx.fillText(String(e.message).slice(0, 30), 4, 12); }
          if (q.get("foot")) { ctx.strokeStyle = "#ff00ff"; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.ellipse(t.x, t.y + 3, 18, 13, 0, 0, 7); ctx.stroke(); }
          ctx.restore();
        }));
        let out = cv;
        if (SC !== 1) {
          out = document.createElement("canvas"); out.width = cv.width * SC; out.height = cv.height * SC;
          const o = out.getContext("2d"); o.imageSmoothingEnabled = false; o.drawImage(cv, 0, 0, out.width, out.height);
        }
        await fetch("/__shot?name=twa_" + KIND + "_" + TAG, { method: "POST", body: out.toDataURL("image/png").slice(22) });
      }
      document.title = "DONE";
      document.getElementById("status").textContent = "saved";
    </script>
  </body>
</html>
