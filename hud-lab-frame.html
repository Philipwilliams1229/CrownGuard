<!doctype html>
<!--
  Dev tool (HUD lab): the real game, exactly as index.html serves it, for the
  lab page to hold in an iPad-sized frame. ?tick drives the game loop from a
  timer, because a hidden browser pane stops requestAnimationFrame dead.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" />
    <title>Crownguard — HUD lab frame</title>
    <style>
      html, body { margin: 0; background: #20242c; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      body { -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
      button { touch-action: manipulation; }
    </style>
    <script>
      if (new URLSearchParams(location.search).has("tick")) {
        window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
        window.cancelAnimationFrame = (id) => clearTimeout(id);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
