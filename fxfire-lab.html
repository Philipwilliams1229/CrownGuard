<!doctype html>
<!-- Burning-ground lab (2026-11-16): the game's drawFireGround + drawFireFront on grass / dark / snow, with a goblin
     standing in the pool, at game size and x3; and a timing of 20 pools (new vs the old painter in flames_oldtmp.js, if present).
     /fxfire-lab.html  saves .shots/fxf_*.png -->
<html><head><meta charset="utf-8" /><title>fire lab</title></head>
<body style="background:#14171d;color:#e8e0c8;font-family:monospace"><div id="s">working</div>
<script type="module">
import { drawFireGround, drawFireFront } from "/src/render/flames.js";
import { rigFrame } from "/src/render/rigs.js";
import { PX } from "/src/render/paint.js";
const H = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const post = (name, cv) => fetch("/__shot?name=" + name, { method: "POST", body: cv.toDataURL("image/png").slice(22) });
const GR = { grass: ["#7eab54", "#6f9a4a", "#92bf62"], dark: ["#3c4535", "#323a2d", "#485140"], snow: ["#e4eaf0", "#d2dce6", "#f4f8fc"] };
const ground = (c, w, h, k) => { const [b, d, l] = GR[k]; c.fillStyle = b; c.fillRect(0, 0, w, h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = H(x * 1.3, y * 0.7 + 4); if (v > 0.93) { c.fillStyle = d; c.fillRect(x, y, 1, 1); } else if (v < 0.035) { c.fillStyle = l; c.fillRect(x, y, 1, 1); } } };
const W = 200, Hh = 120, TMS = 100000;
const cells = [];  // [label, pool, goblin dx]
const pools = [{ r: 32, until: TMS + 3000, born: TMS - 5000 }, { r: 32, until: TMS + 3000, born: TMS - 5000 }, { r: 24, until: TMS + 3000, born: TMS - 5000 }, { r: 40, until: TMS + 3000, born: TMS - 5000 }, { r: 32, until: TMS + 3000, born: TMS - 120 }, { r: 32, until: TMS + 1000, born: TMS - 5000 }];
const names = ["r32a", "r32b", "r24", "r40", "newborn", "dying"];
const out = [];
for (const kind of ["grass", "dark", "snow"]) {
  const strip = mk(W * pools.length, Hh), sx = strip.getContext("2d"); sx.imageSmoothingEnabled = false;
  pools.forEach((p, i) => {
    const cv = mk(W, Hh), c = cv.getContext("2d"); ground(c, W, Hh, kind);
    c.save(); c.translate(W / 2, Hh / 2 + 4); c.scale(PX, PX);   // the game draws in world units; here 1 art pixel = 1 canvas pixel
    const gr = { kind: "fire", x: i === 1 ? 4 : 0, y: 0, ...p }, tt = 3.3 + i * 0.07;
    drawFireGround(c, gr, tt, TMS);
    const s = rigFrame("goblin", "walk", (i * 3) % 8, ""); c.drawImage(s.cv, -s.ax + (i % 2 ? 3 : -4), -s.ay + 2, s.cv.width / PX, s.cv.height / PX);
    drawFireFront(c, gr, tt, TMS);
    c.restore(); sx.drawImage(cv, i * W, 0);
  });
  const big = mk(strip.width * 3, strip.height * 3), bx = big.getContext("2d"); bx.imageSmoothingEnabled = false; bx.drawImage(strip, 0, 0, big.width, big.height);
  await post("fxf_" + kind + "_x1", strip); await post("fxf_" + kind + "_x3", big);
}
// timing: 20 pools a frame
const T = async (mod) => { const cv = mk(W * 5, Hh * 4), c = cv.getContext("2d"); c.scale(PX, PX); const list = []; for (let i = 0; i < 20; i++) list.push({ kind: "fire", x: ((i % 5) * W + 100) / PX, y: (Math.floor(i / 5) * Hh + 60) / PX, r: 32, born: TMS - 5000, until: TMS + 4000 });
  const fr = (t) => { for (const gr of list) { mod.drawFireGround(c, gr, t, TMS); mod.drawFireFront?.(c, gr, t, TMS); } };
  for (let k = 0; k < 40; k++) fr(k * 0.05);
  const t0 = performance.now(); for (let k = 0; k < 400; k++) fr(k * 0.016); return (performance.now() - t0) / 400; };
let msg = "new " + (await T({ drawFireGround, drawFireFront })).toFixed(3) + " ms/frame (20 pools)";
try { const old = await import("/src/render/flames_oldtmp.js"); msg += " | old " + (await T(old)).toFixed(3); } catch (e) { msg += " | old n/a " + e.message; }
document.title = "DONE"; document.getElementById("s").textContent = msg;
</script></body></html>
