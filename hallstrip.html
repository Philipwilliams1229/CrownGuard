<!doctype html>
<!--
  One hall form through time, as a strip of frames (left to right), so a
  crew's motion can be judged as it plays: one firing cycle (shot at frame
  0: t.anim 1 decaying at 4/s, t.cd running down from the form's rate, as
  engine/update.js does), or the idle between waves.

    /hallstrip.html?kind=wizard&form=3,b,a&n=12&tag=x
    &idle=1&secs=6         idle over 6 seconds instead of one firing cycle
    &secs=2                a firing strip over 2 s (default: one cycle, the rate)
    &crop=-30,-80,60,90    the window round the hall's anchor (x, y, w, h)
    &scale=3               enlargement of the saved PNG (default 3)
    &realm=greenwood

  form = level[,branch[,rank4]]. Saved to .shots/strip_<kind>_<tag>.png.
  The time of each frame is printed above it.
-->
<html>
  <head><meta charset="utf-8" /><title>hall strip</title>
  <style>body { background: #20242c; color: #e8e0c8; font-family: monospace; padding: 12px; }</style></head>
  <body>
    <div id="status">painting…</div>
    <script type="module">
      import { selectRealm } from "/src/data/maps.js";
      import * as T from "/src/render/towers.js";
      import { groundLayer } from "/src/render/world.js";
      import { drawGroundBlend } from "/src/render/groundblend.js";
      import { getStats } from "/src/engine/towers.js";
      const q = new URLSearchParams(location.search);
      const KIND = q.get("kind") || "archer", TAG = q.get("tag") || "x", SC = Number(q.get("scale")) || 3;
      selectRealm(q.get("realm") || "greenwood");
      const P = {
        archer: T.drawArcherTower, knight: T.drawGarrison, wizard: T.drawWizardSpire, support: T.drawSupportTower,
        catapult: T.drawCatapult, spiker: T.drawBladewheel, goldworks: T.drawGoldworks, trapsmith: T.drawTrapsmith,
        falconry: T.drawFalconry, gunpowder: T.drawGunpowder, riverwatch: T.drawRiverwatchHall, assassin: T.drawAssassin, sunforge: T.drawSunforge,
      };
      const [lv, br, r4] = (q.get("form") || "1").split(",");
      const form = { level: Number(lv) || 1, branch: br || null, rank4: r4 || null };
      const idle = q.get("idle") === "1";
      const N = Number(q.get("n")) || 10;
      const [cx, cy, cw, ch] = (q.get("crop") || "-30,-80,60,96").split(",").map(Number);
      const probe = { kind: KIND, level: form.level, branch: form.branch, rank4: form.rank4, invested: 0 };
      let rate = 1000;
      try { rate = getStats(probe).rate || 1000; } catch (e) { console.error(e); }
      const secs = Number(q.get("secs")) || (idle ? 6 : rate / 1000);
      const R = 2, HEAD = 14;
      const cv = document.createElement("canvas");
      cv.width = cw * R * N; cv.height = (ch + HEAD) * R;
      const ctx = cv.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = "#20242c"; ctx.fillRect(0, 0, cv.width, cv.height);
      const ground = groundLayer();
      const X = 60, Y = 110;                 // the hall's anchor in its own little world
      for (let i = 0; i < N; i++) {
        const s = (i / N) * secs;
        ctx.save();
        ctx.setTransform(R, 0, 0, R, i * cw * R, HEAD * R);
        ctx.beginPath(); ctx.rect(0, 0, cw, ch); ctx.clip();
        ctx.translate(-(X + cx), -(Y + cy));
        ctx.drawImage(ground, 120 * 2, 160 * 2, 240 * 2, 200 * 2, 0, 0, 240, 200);
        const time = 3 + s;
        const t = {
          id: 3, kind: KIND, x: X, y: Y, level: form.level, branch: form.branch, rank4: form.rank4,
          cd: idle ? 0 : Math.max(0, rate - s * 1000), aim: "first", lastAim: 0.4, shotIdx: 0, critIdx: 0, invested: 0, units: [],
          anim: idle ? 0 : Math.max(0, 1 - 4 * s), mAnim: idle ? 0 : Math.max(0, 1 - 3.2 * s),
          rally: null, kills: 0, dmgOut: 0, liveTime: 1, _idle: idle, charges: 3, ramp: 2, eagle: null, poolIdx: 1,
        };
        try { drawGroundBlend(ctx, t, false); P[KIND](ctx, t, time); drawGroundBlend(ctx, t, true); }
        catch (e) { console.error(e); ctx.fillStyle = "red"; ctx.fillText(String(e.message).slice(0, 30), X, Y); }
        ctx.restore();
        ctx.fillStyle = "#e8e0c8"; ctx.font = "16px monospace";
        ctx.fillText(`${s.toFixed(2)}s`, i * cw * R + 4, 20);
      }
      let out = cv;
      if (SC !== 1) {
        out = document.createElement("canvas"); out.width = cv.width * SC / 2; out.height = cv.height * SC / 2;
        const o = out.getContext("2d"); o.imageSmoothingEnabled = false; o.drawImage(cv, 0, 0, out.width, out.height);
      }
      const name = `strip_${KIND}_${TAG}`;
      await fetch("/__shot?name=" + name, { method: "POST", body: out.toDataURL("image/png").slice(22) });
      document.title = "DONE"; document.getElementById("status").textContent = `saved .shots/${name}.png (rate ${rate} ms)`;
    </script>
  </body>
</html>
