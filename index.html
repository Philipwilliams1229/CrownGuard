<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#20242c" />
    <!-- installs to an iPad's home screen as a full-screen, sideways game -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crownguard" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" />
    <!-- the HUD's chunky pixel display face (falls back to Verdana offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" />
    <title>Crownguard</title>
    <style>
      /* a touch screen must never bounce, pan, select text, flash on tap or zoom
         the page: every screen fits the window, and only panels' own lists scroll */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #20242c; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      body { -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
      button { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
