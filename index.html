<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#20242c" />
    <!-- installs to an iPad's home screen as a full-screen, sideways game -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crownguard" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" />
    <!-- the default type option's faces (tidy3), started before the bundle
         runs: CG Pixel Sans from ./fonts/, and the two Google stylesheets
         src/ui/fonts.js fetches (same URLs, so its requests use these). Every
         font the game uses is named in fonts.js, which loads them all; another
         option (?type=<id>) loads its own faces from there. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/CGPixelSans.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/CGPixelSans-Bold.woff2" crossorigin />
    <link rel="preload" as="fetch" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" crossorigin />
    <link rel="preload" as="fetch" href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" crossorigin />
    <title>Crownguard</title>
    <style>
      /* a touch screen must never bounce, pan, select text, flash on tap or zoom
         the page: every screen fits the window, and only panels' own lists scroll */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #20242c; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      body { -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
      button { touch-action: manipulation; }
      /* the game's root is pinned to all four edges of the screen. On an iPad
         home-screen install 100vh / 100dvh / height:100% can come out a few
         px short of the real screen, leaving a gray strip along the bottom;
         a fixed box with every edge at 0 always reaches the true edges */
      #root { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; }
      /* iOS/iPadOS 26 home-screen app (WebKit bug 301108): with the
         see-through status bar, a page that is height:100% + overflow:hidden
         gets a layout one status bar short (712 of 744 on an iPad mini) and a
         dead gray strip along the bottom. A page at least 100lvh tall and not
         clipped makes iOS size the layout to the whole screen (measured with
         vp.html: innerHeight 744, fixed bottom:0 on the glass). Only in the
         installed app: in a Safari tab 100lvh is taller than the view and
         the page would scroll. Only on a tablet-sized screen, too: on an
         iPhone it pushed the whole battle HUD down a status bar's height
         (it reads a top safe area even on its side), and the phone never
         had the strip. */
      @media (display-mode: fullscreen) and (min-width: 600px) and (min-height: 600px),
             (display-mode: standalone) and (min-width: 600px) and (min-height: 600px) {
        html, body { height: auto; min-height: 100lvh; overflow: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
