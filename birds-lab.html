<!doctype html>
<!--
  Dev tool (birds-lab: a copy of props-lab with many stoop moments; &zoom=1..3): every object a hall puts out into the world — traps, rolling
  logs, falcon stoops and the war-eagle, projectiles in flight, and the
  soldiers, blades, boats and bands that walk the field — each frame drawn
  through the real draw() and zoomed in on the road. Saves one sheet per
  section to .shots/props_<section>_<tag>.png and writes DONE in the title.
    /props-lab.html?tag=v1                      every section
    /props-lab.html?tag=v1&only=traps,logs      some sections
  Sections: traps, logs, birds, shots, units.  &realm=<id> changes the ground.
-->
<html><head><meta charset="utf-8" /><title>birds lab…</title></head>
<body style="background:#14171d;color:#e8e0c8;font-family:monospace;padding:16px"><div id="out">painting…</div>
<script type="module">
import { selectRealm } from "/src/data/maps.js";
import { W, H, CASTLE_HP } from "/src/data/constants.js";
import { posAt, angleAt, TOTAL_LEN } from "/src/engine/path.js";
import { draw } from "/src/render/draw.js";
import { ENEMIES } from "/src/data/enemies.js";
import { makeTower, syncUnits } from "/src/engine/towers.js";
import { fieldHero } from "/src/engine/actions.js";

const q = new URLSearchParams(location.search);
const TAG = q.get("tag") || "x";
const ONLY = q.get("only") ? q.get("only").split(",") : null;
selectRealm(q.get("realm") || "greenwood");

const AT = 0.46;                                    // the stretch of road every frame looks at
const [RX, RY] = posAt(TOTAL_LEN * AT);
const ZOOM = Number(q.get("zoom")) || 3;
const cam = (x = RX + 18, y = RY - 20) => ({ zoom: ZOOM, x: x - W / (2 * ZOOM), y: y - H / (2 * ZOOM) });
const base = (time, o = {}) => ({
  time, shake: 0, cam: cam(), grounds: [], traps: [], logs: [], bands: [], volleys: [],
  buildMode: null, hover: null, gold: 500, selectedId: null,
  towers: [], enemies: [], projectiles: [], effects: [],
  lives: CASTLE_HP, paused: false, phase: "combat", ...o,
});
const along = (df, lane = 0) => {
  const d = TOTAL_LEN * AT + df, [x, y] = posAt(d), a = angleAt(d) + Math.PI / 2;
  return [x + Math.cos(a) * lane, y + Math.sin(a) * lane];
};
let nid = 5000;
const foe = (type, df, lane = 0) => {
  const d = ENEMIES[type], [x, y] = along(df, lane);
  return { id: nid++, type, x, y, dist: TOTAL_LEN * AT + df, lane, size: d.size || 13, face: 1, hp: d.hp * 0.7, maxHp: d.hp,
    armor: 0, mres: 0, dead: false, boss: !!d.boss, flying: !!d.flying, born: 0, hitFlash: 0, atkAnim: 0, auraSlow: 0,
    slowUntil: 0, stunUntil: 0, burnUntil: 0, poisonUntil: 0, brittleUntil: 0, healedFlash: 0, guard: 0, guardFlash: 0, blockedBy: null, engaged: false };
};
const hall = (kind, o = {}) => { const t = makeTower(kind, RX + 60, RY - 70); Object.assign(t, { level: 3, ...o }); return t; };

const sheets = [];
const section = (name, frames) => { if (!ONLY || ONLY.includes(name)) sheets.push([name, frames]); };

// ---- traps: every kind the trapsmith lays, flush with the road ----
section("traps", [
  ["spike · jaws · caltrop", base(1.2, { traps: [
    { x: along(-30)[0], y: along(-30)[1], kind: "spike" }, { x: along(0)[0], y: along(0)[1], kind: "jaws" }, { x: along(30)[0], y: along(30)[1], kind: "caltrop" }] })],
  ["mines · a balloon", base(1.5, { traps: [
    { x: along(-25, -12)[0], y: along(-25, -12)[1], kind: "mine", branch: "b" }, { x: along(0, 10)[0], y: along(0, 10)[1], kind: "mine", branch: "b" },
    { x: along(28)[0], y: along(28)[1], kind: "balloon", sky: true }] })],
  ["a foe stepping on", base(2.1, { traps: [{ x: along(0)[0], y: along(0)[1], kind: "jaws" }, { x: along(24)[0], y: along(24)[1], kind: "mine", branch: "b" }],
    enemies: [foe("goblin", -4)] })],
]);

// ---- rolling logs: the trunk, the Iron Drum, the Powder Keg Run ----
const log = (df, o = {}) => { const [x, y] = along(df); return { id: nid++, x, y, a: angleAt(TOTAL_LEN * AT + df), w: 22, spin: 1.3, hitIds: [], ...o }; };
section("logs", [
  ["the Log Roller", base(1.1, { logs: [log(-20)], enemies: [foe("goblin", 22, 12)] })],
  ["the Iron Drum", base(1.3, { logs: [log(0, { w: 28, stun: 900, spin: 2.2 })] })],
  ["the Powder Keg Run", base(1.6, { logs: [log(0, { w: 24, burn: 26, blast: 96, spin: 3.1 })] })],
]);

// ---- birds: many moments of a stoop (birds-lab only) ----
const [fx0, fy0] = [RX + 44, RY - 40];
const stoop = (life, prog, o = {}) => ({ type: "talon", x1: fx0, y1: fy0, x2: RX, y2: RY - 6, ttl: life * (1 - prog), life, ...o });
const moments = [0.04, 0.08, 0.2, 0.34, 0.44, 0.5, 0.55, 0.62, 0.7, 0.8, 0.9];
section("birds", [
  ...moments.map((p) => ["stoop " + p, base(1.4, { effects: [stoop(520, p)], enemies: [foe("goblin", 0)] })]),
  ...[0.3, 0.5, 0.7].map((p) => ["leftward " + p, base(1.4, { effects: [stoop(520, p, { x1: RX - 44, y1: RY - 40, x2: RX, y2: RY - 6 })], enemies: [foe("goblin", 0)] })]),
  ...[0.3, 0.5, 0.75].map((p) => ["ricochet " + p, base(1.4, { effects: [stoop(420, p, { x1: RX - 30, y1: RY - 6, x2: RX + 10, y2: RY + 4 })], enemies: [foe("goblin", 0)] })]),
  ["four at once", base(1.4, { effects: [stoop(520, 0.2), stoop(520, 0.4, { x1: RX - 40 }), stoop(520, 0.52, { x2: RX + 20 }), stoop(520, 0.75, { y1: RY - 60 })], enemies: [foe("goblin", 0)] })],
  ["the war-eagle", base(1.4, { towers: [hall("falconry", { branch: "a", rank4: "b", eagle: { x: RX - 10, y: RY - 10, state: "fly", hp: 100 } })] })],
]);

// ---- shots in the air ----
const shot = (kind, o = {}) => { const [x, y] = along(-10, -8); const [tx, ty] = along(30, 6); return { id: nid++, kind, x, y, sx: x - 20, sy: y - 20, tx, ty, total: 60, speed: 300, targetId: null, delay: 0, src: 1, ...o }; };
section("shots", [
  ["arrow · bolt · spike", base(1.2, { projectiles: [shot("arrow"), shot("arrow", { big: true, y: along(-10, 8)[1] }), shot("spike", { x: along(-20)[0], y: along(-20)[1] })] })],
  ["rock · ball · shell", base(1.2, { projectiles: [shot("rock"), shot("ball", { x: along(-20, 10)[0], y: along(-20, 10)[1] }), shot("shell", { x: along(0, -14)[0], y: along(0, -14)[1] })] })],
]);

// ---- units: the soldiers, blades, boats and bands ----
const withUnits = (t) => { syncUnits(t); t.rally = { x: RX, y: RY }; for (const [i, u] of t.units.entries()) { u.x = RX - 14 + i * 14; u.y = RY + (i % 2) * 6; u.state = "rally"; } return t; };
const heroG = (key) => { const g = base(1.3); const b = fieldHero(g, key, 8, RX, RY); b.units[0].state = "rally"; return g; };
section("units", [
  ["garrison knights", base(1.3, { towers: [withUnits(hall("knight", { rally: { x: RX, y: RY } }))] })],
  ["the assassins' blades", base(1.3, { towers: [withUnits(hall("assassin", { rally: { x: RX, y: RY } }))] })],
  ["Sir Aldric", heroG("aldric")],
  ["Wren", heroG("wren")],
]);

// ---- paint ----
const out = document.getElementById("out");
for (const [name, frames] of sheets) {
  const FW = 280, FH = 200;
  const sheet = document.createElement("canvas");
  const COLS = 6, ROWS = Math.ceil(frames.length / COLS); sheet.width = FW * Math.min(COLS, frames.length); sheet.height = (FH + 18) * ROWS;
  const sc = sheet.getContext("2d");
  sc.fillStyle = "#14171d"; sc.fillRect(0, 0, sheet.width, sheet.height);
  frames.forEach(([label, g], i) => {
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    try { draw(g, cv, { current: null }); } catch (e) { console.error(name, label, e); label += " — " + e.message; }
    sc.imageSmoothingEnabled = false;
    // the middle of the board, where the camera looked
    const ox = (i % COLS) * FW, oy = Math.floor(i / COLS) * (FH + 18);
    sc.drawImage(cv, (cv.width - FW) / 2, (cv.height - FH) / 2, FW, FH, ox, oy, FW, FH);
    sc.fillStyle = "#e8e0c8"; sc.font = "11px monospace"; sc.fillText(label, ox + 6, oy + FH + 13);
  });
  out.appendChild(sheet);
  await fetch(`/__shot?name=birdslab_${name}_${TAG}`, { method: "POST", body: sheet.toDataURL("image/png").slice(22) });
}
// the hawk alone, every pose at a few headings, 6x
{
  const { stampHawk } = await import("/src/render/birds.js");
  const poses = ["tuck", "strike", "up", "mid", "down"], heads = [[1, 0], [1, 0.6], [1, 1.8], [1, -0.6], [-1, 0.6]];
  const Z = 6, CW = 22;
  const sh = document.createElement("canvas"); sh.width = CW * Z * heads.length; sh.height = CW * Z * poses.length;
  const c = sh.getContext("2d"); c.fillStyle = "#c9a56a"; c.fillRect(0, 0, sh.width, sh.height); c.imageSmoothingEnabled = false;
  c.scale(Z, Z);
  poses.forEach((ps, j) => heads.forEach(([dx, dy], i) => stampHawk(c, ps, i * CW + CW / 2, j * CW + CW / 2, dx, dy)));
  out.appendChild(sh);
  await fetch(`/__shot?name=birdslab_hawk_${TAG}`, { method: "POST", body: sh.toDataURL("image/png").slice(22) });
}
out.prepend(`saved ${sheets.map((s) => s[0]).join(", ")}`);
document.title = "DONE";
</script>
</body></html>
